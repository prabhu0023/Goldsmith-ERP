# CI for every push and pull request (EP-01-S7 to S10).
# Each check is its own job so a failure in one does not hide the others, and each job name is a
# required status check on main (see docs/setup/branch-protection.md, EP-01-S11):
#   Lint, Typecheck, Test, Build, Secret scan
# The Test job runs a PostgreSQL 17 service container (EP-02-S1, S13, S14): it migrates an empty
# database twice (the second run must apply nothing), seeds the prototype data, then runs the
# database tests, whose global setup wipes and re-migrates the same database. The credentials
# are the image defaults and exist only inside the job.
# It also starts the SeaweedFS object store (EP-09, docs/setup/files.md) with `docker run`, since a
# service container cannot pass its `server -s3 …` command; its keys are the local-only
# placeholders in docker/seaweedfs/s3.json and exist only inside the job.
# A deploy job (EP-01-S12, waiting on decision D1a) can later be added with `needs:` on these
# jobs and `if: github.ref == 'refs/heads/main'`, consuming the release artefact from Build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (all packages + shared duplicate check)
        run: npx biome lint --reporter=github && node scripts/check-shared-duplicates.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck shared
        if: ${{ !cancelled() }}
        run: npm run typecheck -w @goldsmith/shared
      - name: Typecheck web
        if: ${{ !cancelled() }}
        run: npm run typecheck -w @goldsmith/web
      - name: Typecheck api
        if: ${{ !cancelled() }}
        run: npm run typecheck -w @goldsmith/api

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goldsmith_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/goldsmith_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/goldsmith_test
      # Local-only object store keys (docker/seaweedfs/s3.json), never a real provider's.
      STORAGE_ENDPOINT: http://localhost:8333
      STORAGE_BUCKET: goldsmith-files
      STORAGE_ACCESS_KEY_ID: goldsmith-local
      STORAGE_SECRET_ACCESS_KEY: goldsmith-local-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Start the object store
        run: |
          docker run -d --name objectstore -p 8333:8333 \
            -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            curl -sf http://localhost:8333/healthz > /dev/null && break
            if [ "$i" = 60 ]; then docker logs objectstore; exit 1; fi
            sleep 1
          done
          npm run storage:create
      - name: Migrate an empty database
        run: npm run db:migrate && npm run db:migrate && npm run db:status
      - name: Seed it
        run: npm run db:seed
      - name: Test shared
        if: ${{ !cancelled() }}
        run: npm test -w @goldsmith/shared -- --reporter=default --reporter=github-actions
      - name: Test web
        if: ${{ !cancelled() }}
        run: npm test -w @goldsmith/web -- --reporter=default --reporter=github-actions
      - name: Test api
        if: ${{ !cancelled() }}
        run: npm test -w @goldsmith/api -- --reporter=default --reporter=github-actions

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      # Dependency order: shared first, then web and api.
      - name: Build shared
        run: npm run build -w @goldsmith/shared
      - name: Build web
        run: npm run build -w @goldsmith/web
      - name: Build api
        run: npm run build -w @goldsmith/api
      - name: Store release artefact (main only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            packages/shared/dist
            packages/web/dist
            packages/api/dist
            packages/api/migrations
            packages/shared/package.json
            packages/api/package.json
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 90

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit (values redacted)
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .
