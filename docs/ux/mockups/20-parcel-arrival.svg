<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="960" fill="#FAF9F7"/>

  <!-- rail -->
  <rect x="0" y="0" width="248" height="960" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="960" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">Main showroom</text>
  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">WORK</text>
  <circle cx="40" cy="140" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="145" font-size="14" fill="#44403C">Today</text>
  <circle cx="40" cy="186" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="191" font-size="14" fill="#44403C">Showroom stock</text>
  <circle cx="40" cy="230" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="235" font-size="14" fill="#44403C">Sell</text>
  <rect x="12" y="252" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="274" r="7" fill="#C9961F"/>
  <text x="62" y="279" font-size="14" font-weight="600" fill="#FFFFFF">Parcels in</text>
  <circle cx="40" cy="318" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="323" font-size="14" fill="#44403C">Customers</text>
  <line x1="12" y1="862" x2="236" y2="862" stroke="#E7E3DC"/>
  <circle cx="44" cy="910" r="18" fill="#E2DCD2"/>
  <text x="44" y="915" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">RV</text>
  <text x="72" y="904" font-size="14" font-weight="600" fill="#1C1917">Rajesh Verma</text>
  <text x="72" y="924" font-size="13" fill="#8A8178">Showroom staff · switch</text>

  <!-- header + steps -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">A parcel has arrived from Mahesh Soni</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Against job MO-2026-118 · weigh the whole thing first, then say what is inside</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <circle cx="300" cy="148" r="14" fill="#1C1917"/>
  <text x="300" y="153" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="324" y="153" font-size="15" font-weight="600" fill="#1C1917">Weigh the parcel and list what is in it</text>
  <line x1="720" y1="148" x2="780" y2="148" stroke="#D6D1C8" stroke-width="2"/>
  <circle cx="802" cy="148" r="14" fill="#FFFFFF" stroke="#D6D1C8" stroke-width="2"/>
  <text x="802" y="153" font-size="13" font-weight="700" fill="#A8A29E" text-anchor="middle">2</text>
  <text x="826" y="153" font-size="15" font-weight="600" fill="#A8A29E">Tag each item</text>
  <line x1="986" y1="148" x2="1046" y2="148" stroke="#D6D1C8" stroke-width="2"/>
  <circle cx="1068" cy="148" r="14" fill="#FFFFFF" stroke="#D6D1C8" stroke-width="2"/>
  <text x="1068" y="153" font-size="13" font-weight="700" fill="#A8A29E" text-anchor="middle">3</text>
  <text x="1092" y="153" font-size="15" font-weight="600" fill="#A8A29E">Match and release</text>

  <!-- ===== LEFT : the three bulk weights ===== -->
  <text x="288" y="202" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WEIGH THE WHOLE PARCEL · ALL THREE FIGURES</text>
  <rect x="288" y="218" width="560" height="430" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="312" y="252" font-size="13" fill="#8A8178">Which scale is this on?</text>
  <rect x="312" y="262" width="300" height="46" rx="10" fill="#FBF3E0" stroke="#EBD9A8"/>
  <text x="332" y="291" font-size="14" font-weight="600" fill="#1C1917">Bench balance · 0.0001 g</text>
  <path d="M586 282 l8 8 l8 -8" fill="none" stroke="#B8860B" stroke-width="1.8" stroke-linecap="round"/>
  <text x="628" y="281" font-size="13" fill="#8A8178">sets how exact</text>
  <text x="628" y="299" font-size="13" fill="#8A8178">the match must be</text>

  <text x="312" y="346" font-size="13" fill="#8A8178">Everything on the scale together</text>
  <rect x="312" y="356" width="400" height="52" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="332" y="390" font-size="20" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">485.5000</text>
  <text x="692" y="390" font-size="15" fill="#8A8178" text-anchor="end">g</text>

  <text x="312" y="438" font-size="13" fill="#8A8178">Of that, the stones, pearls, lac — anything not gold</text>
  <rect x="312" y="448" width="400" height="52" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="332" y="482" font-size="20" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">38.2000</text>
  <text x="692" y="482" font-size="15" fill="#8A8178" text-anchor="end">g</text>

  <rect x="312" y="524" width="512" height="92" rx="12" fill="#FBF3E0"/>
  <text x="332" y="552" font-size="12" font-weight="700" fill="#8A4208" letter-spacing="1.2">SO THE PURE GOLD IN THIS PARCEL IS</text>
  <text x="332" y="592" font-size="28" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">447.3000 g</text>
  <text x="804" y="592" font-size="13" fill="#8A4208" text-anchor="end">485.5000 − 38.2000</text>

  <!-- ===== RIGHT : the manifest ===== -->
  <text x="880" y="202" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">SAY WHAT IS INSIDE · MIXED IS FINE</text>
  <rect x="880" y="218" width="512" height="430" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="904" y="250" font-size="13" fill="#8A8178">List the items. Counts add up as you go — you never set a total.</text>

  <!-- manifest rows -->
  <rect x="904" y="268" width="464" height="48" rx="10" fill="#FAF9F7" stroke="#E7E3DC"/>
  <text x="924" y="297" font-size="15" fill="#1C1917">Temple Haram · Chettinad</text>
  <rect x="1236" y="278" width="112" height="28" rx="8" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1258" y="297" font-size="14" font-weight="600" fill="#1C1917">2</text>
  <path d="M1316 286 l8 0 M1320 282 v8" stroke="#1C1917" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M1290 292 l8 0" stroke="#1C1917" stroke-width="1.6" stroke-linecap="round"/>

  <rect x="904" y="324" width="464" height="48" rx="10" fill="#FAF9F7" stroke="#E7E3DC"/>
  <text x="924" y="353" font-size="15" fill="#1C1917">Kundan Choker</text>
  <rect x="1236" y="334" width="112" height="28" rx="8" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1258" y="353" font-size="14" font-weight="600" fill="#1C1917">1</text>

  <rect x="904" y="380" width="464" height="48" rx="10" fill="#FAF9F7" stroke="#E7E3DC"/>
  <text x="924" y="409" font-size="15" fill="#1C1917">Polki Kada · pair</text>
  <rect x="1236" y="390" width="112" height="28" rx="8" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1258" y="409" font-size="14" font-weight="600" fill="#1C1917">2</text>

  <rect x="904" y="436" width="464" height="48" rx="10" fill="#FAF9F7" stroke="#E7E3DC"/>
  <text x="924" y="465" font-size="15" fill="#1C1917">Meenakari Pendant</text>
  <rect x="1236" y="446" width="112" height="28" rx="8" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1258" y="465" font-size="14" font-weight="600" fill="#1C1917">2</text>

  <rect x="904" y="492" width="464" height="48" rx="10" fill="#FFFFFF" stroke="#D6D1C8" stroke-dasharray="5 4"/>
  <path d="M928 516 h14 M935 509 v14" stroke="#57534E" stroke-width="1.8" stroke-linecap="round"/>
  <text x="956" y="521" font-size="14" font-weight="600" fill="#1C1917">Add another kind of item</text>

  <text x="904" y="582" font-size="13" fill="#8A8178">Also expecting rings, bangles — add them the same way</text>

  <rect x="904" y="596" width="464" height="36" rx="8" fill="#F1EFEA"/>
  <text x="924" y="619" font-size="14" font-weight="600" fill="#44403C">That is 12 items to tag in the next step</text>

  <!-- ===== action ===== -->
  <rect x="288" y="676" width="1104" height="104" rx="16" fill="#1C1917"/>
  <text x="320" y="714" font-size="17" font-weight="600" fill="#FFFFFF">Open the parcel for tagging</text>
  <text x="320" y="740" font-size="14" fill="#A8A29E">The three weights above are what the 12 tags will have to add up to, exactly, on this scale.</text>
  <text x="320" y="760" font-size="13" fill="#8A8178">Nothing can be released until all 12 are tagged and the sums match.</text>
  <rect x="1120" y="700" width="248" height="48" rx="10" fill="#C9961F"/>
  <text x="1244" y="730" font-size="15" font-weight="700" fill="#1C1917" text-anchor="middle">Start tagging · 0 of 12</text>

  <text x="288" y="828" font-size="13" fill="#8A8178">A parcel too heavy for this balance is weighed in trays — each tray is its own weighing on its own scale, and they sum. The match stays exact either way.</text>
</svg>
