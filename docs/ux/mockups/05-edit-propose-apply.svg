<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="mo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1C1917" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1440" height="920" fill="#EDEAE4"/>

  <text x="48" y="54" font-size="22" font-weight="600" fill="#1C1917">Changing a tag already in the shop · staff ask, owner does</text>
  <text x="48" y="80" font-size="14" fill="#57534E">Staff describe the change and why. Only the owner applies it, and only with a token from his own WhatsApp. Staff never touch the field.</text>

  <!-- ===== STAFF SIDE ===== -->
  <text x="48" y="128" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHAT STAFF DO · PROPOSE</text>
  <rect x="48" y="144" width="648" height="700" rx="18" fill="#FFFFFF" filter="url(#mo)"/>

  <circle cx="84" cy="186" r="16" fill="#E2DCD2"/>
  <text x="84" y="191" font-size="12" font-weight="600" fill="#44403C" text-anchor="middle">RV</text>
  <text x="112" y="182" font-size="15" font-weight="600" fill="#1C1917">Rajesh · showroom staff</text>
  <text x="112" y="200" font-size="13" fill="#8A8178">proposing a change, not making one</text>

  <rect x="80" y="224" width="584" height="72" rx="12" fill="#FAF9F7" stroke="#E7E3DC"/>
  <rect x="94" y="238" width="44" height="44" rx="8" fill="#EFE9DF"/>
  <text x="152" y="256" font-size="15" font-weight="600" fill="#1C1917">Antique Kundan Choker</text>
  <text x="152" y="276" font-size="13" fill="#8A8178">TAG-2026-8841 · in stock · 41.590 g pure gold</text>

  <text x="80" y="332" font-size="13" fill="#8A8178">What should change?</text>
  <rect x="80" y="342" width="280" height="46" rx="10" fill="#FBF3E0" stroke="#C9961F" stroke-width="2"/>
  <text x="100" y="371" font-size="14" font-weight="600" fill="#1C1917">The tag weight</text>
  <path d="M332 362 l8 8 l8 -8" fill="none" stroke="#B8860B" stroke-width="1.8" stroke-linecap="round"/>

  <text x="80" y="420" font-size="13" fill="#8A8178">From</text>
  <rect x="80" y="430" width="180" height="48" rx="10" fill="#F1EFEA"/>
  <text x="100" y="461" font-size="16" font-weight="600" fill="#57534E" font-family="ui-monospace, Menlo, monospace">48.6500 g</text>
  <path d="M278 454 l16 0 M288 448 l8 6 l-8 6" fill="none" stroke="#8A8178" stroke-width="1.8" stroke-linecap="round"/>
  <text x="316" y="420" font-size="13" fill="#8A8178">To</text>
  <rect x="316" y="430" width="180" height="48" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="336" y="461" font-size="16" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">48.6100 g</text>
  <rect x="512" y="430" width="152" height="48" rx="10" fill="#FDF0E2"/>
  <text x="528" y="459" font-size="13" font-weight="600" fill="#8A4208">taking off 40 mg</text>

  <text x="80" y="520" font-size="13" fill="#8A8178">Why? The owner will read this.</text>
  <rect x="80" y="530" width="584" height="92" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="100" y="558" font-size="14" fill="#1C1917">Re-weighed on the calibrated balance this morning,</text>
  <text x="100" y="580" font-size="14" fill="#1C1917">reads 40 mg lighter than the tag. Correcting the tag</text>
  <text x="100" y="602" font-size="14" fill="#1C1917">to the true weight.</text>

  <rect x="80" y="646" width="584" height="60" rx="12" fill="#F1EFEA"/>
  <text x="100" y="672" font-size="13" font-weight="600" fill="#57534E">You cannot change the weight yourself</text>
  <text x="100" y="692" font-size="13" fill="#57534E">This goes to the owner. The piece stays sellable while he decides.</text>

  <rect x="80" y="760" width="300" height="52" rx="10" fill="#1C1917"/>
  <text x="230" y="792" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send to the owner</text>
  <rect x="396" y="760" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="456" y="792" font-size="15" font-weight="600" fill="#1C1917" text-anchor="middle">Cancel</text>

  <!-- arrow across -->
  <path d="M708 480 l24 0 M724 472 l10 8 l-10 8" fill="none" stroke="#C9961F" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ===== OWNER SIDE ===== -->
  <text x="744" y="128" font-size="12" font-weight="700" fill="#8A4208" letter-spacing="1.4">WHAT THE OWNER DOES · READ, TOKEN, APPLY</text>
  <rect x="744" y="144" width="648" height="700" rx="18" fill="#FFFFFF" filter="url(#mo)"/>

  <circle cx="780" cy="186" r="16" fill="#FBF3E0"/>
  <text x="780" y="191" font-size="12" font-weight="600" fill="#8A4208" text-anchor="middle">SS</text>
  <text x="808" y="182" font-size="15" font-weight="600" fill="#1C1917">Sanjay · owner</text>
  <text x="808" y="200" font-size="13" fill="#8A8178">the only person who can apply this</text>

  <!-- the request, read-only -->
  <rect x="776" y="224" width="584" height="110" rx="12" fill="#FAF9F7" stroke="#E7E3DC"/>
  <text x="796" y="252" font-size="13" font-weight="700" fill="#8A8178" letter-spacing="1.2">RAJESH ASKS</text>
  <text x="796" y="280" font-size="15" font-weight="600" fill="#1C1917">TAG-8841 weight · 48.6500 → 48.6100 g (−40 mg)</text>
  <text x="796" y="304" font-size="13" fill="#57534E">"Re-weighed on the calibrated balance, reads 40 mg lighter."</text>
  <text x="796" y="324" font-size="13" fill="#8A8178">pure gold would go 41.590 → 41.550 g</text>

  <!-- step a : agree -->
  <text x="776" y="368" font-size="14" font-weight="600" fill="#1C1917">1 · Do you agree with the change?</text>
  <rect x="776" y="382" width="200" height="44" rx="10" fill="#1C1917"/>
  <text x="876" y="410" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Yes, send me a token</text>
  <rect x="988" y="382" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1058" y="410" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Refuse</text>

  <!-- step b : token -->
  <text x="776" y="464" font-size="14" font-weight="600" fill="#1C1917">2 · Enter the token sent to your WhatsApp</text>
  <rect x="776" y="478" width="360" height="96" rx="12" fill="#F0F6EF" stroke="#CFE3CC"/>
  <circle cx="802" cy="504" r="11" fill="#1D7A4C"/>
  <text x="822" y="509" font-size="12" font-weight="700" fill="#15603C">To Sanjay's phone · now</text>
  <text x="796" y="540" font-size="13" fill="#44403C">JGD: confirm edit to TAG-8841. Token</text>
  <text x="796" y="560" font-size="15" font-weight="700" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">480 913</text>

  <g>
    <rect x="1160" y="490" width="34" height="48" rx="8" fill="#FAF9F7" stroke="#C9961F" stroke-width="2"/>
    <text x="1177" y="523" font-size="20" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">4</text>
    <rect x="1200" y="490" width="34" height="48" rx="8" fill="#FAF9F7" stroke="#C9961F" stroke-width="2"/>
    <text x="1217" y="523" font-size="20" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">8</text>
    <rect x="1240" y="490" width="34" height="48" rx="8" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
    <rect x="1255" y="502" width="2" height="24" fill="#1C1917"/>
    <rect x="1280" y="490" width="34" height="48" rx="8" fill="#FFFFFF" stroke="#E7E3DC"/>
    <rect x="1320" y="490" width="34" height="48" rx="8" fill="#FFFFFF" stroke="#E7E3DC"/>
  </g>
  <text x="776" y="596" font-size="13" fill="#8A8178">Two factors: you are signed in, and you hold the phone. Valid 10 minutes.</text>

  <!-- step c : apply -->
  <text x="776" y="644" font-size="14" font-weight="600" fill="#1C1917">3 · Apply it</text>
  <rect x="776" y="658" width="584" height="86" rx="12" fill="#FBF3E0" stroke="#EBD9A8"/>
  <text x="796" y="686" font-size="12" font-weight="700" fill="#8A4208" letter-spacing="1.2">AFTER YOU APPLY</text>
  <text x="796" y="712" font-size="14" fill="#8A4208">Pure gold becomes 41.550 g. The change is kept against</text>
  <text x="796" y="732" font-size="14" fill="#8A4208">Rajesh's name, your token, the old and new values.</text>

  <rect x="776" y="768" width="280" height="52" rx="10" fill="#C9961F"/>
  <text x="916" y="800" font-size="15" font-weight="700" fill="#1C1917" text-anchor="middle">Apply the change</text>
  <text x="1070" y="800" font-size="13" fill="#8A8178">staff see it update in stock</text>
</svg>
