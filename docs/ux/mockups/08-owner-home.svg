<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="980" fill="#FAF9F7"/>

  <!-- rail -->
  <rect x="0" y="0" width="248" height="980" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="980" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">All branches</text>
  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">OVERSIGHT</text>
  <rect x="12" y="118" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="140" r="7" fill="#C9961F"/>
  <text x="62" y="145" font-size="14" font-weight="600" fill="#FFFFFF">Decisions</text>
  <rect x="192" y="131" width="32" height="20" rx="10" fill="#B3261E"/>
  <text x="208" y="145" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="40" cy="186" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="191" font-size="14" fill="#44403C">Money and stock</text>
  <circle cx="40" cy="230" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="235" font-size="14" fill="#44403C">Karigars</text>
  <circle cx="40" cy="274" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="279" font-size="14" fill="#44403C">Security log</text>

  <text x="24" y="336" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">SHOPFLOOR</text>
  <circle cx="40" cy="366" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="371" font-size="14" fill="#44403C">Showroom stock</text>
  <circle cx="40" cy="410" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="415" font-size="14" fill="#44403C">Sales and bills</text>
  <circle cx="40" cy="454" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="459" font-size="14" fill="#44403C">Customers</text>

  <!-- the OTP switch lives in the owner's own screen, not in global chrome -->
  <text x="24" y="520" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">YOUR RULE</text>
  <rect x="12" y="534" width="224" height="104" rx="12" fill="#FBF3E0" stroke="#EBD9A8"/>
  <text x="28" y="562" font-size="14" font-weight="600" fill="#1C1917">Code before a tag edit</text>
  <text x="28" y="582" font-size="13" fill="#8A4208">Staff must get your</text>
  <text x="28" y="600" font-size="13" fill="#8A4208">WhatsApp code first.</text>
  <rect x="28" y="610" width="52" height="28" rx="14" fill="#1D7A4C"/>
  <circle cx="68" cy="624" r="11" fill="#FFFFFF"/>
  <text x="92" y="629" font-size="14" font-weight="700" fill="#15603C">On</text>

  <line x1="12" y1="862" x2="236" y2="862" stroke="#E7E3DC"/>
  <circle cx="44" cy="910" r="18" fill="#E2DCD2"/>
  <text x="44" y="915" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">SS</text>
  <text x="72" y="904" font-size="14" font-weight="600" fill="#1C1917">Sanjay Seth</text>
  <text x="72" y="924" font-size="13" fill="#8A8178">Owner · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">Three things need you, Sanjay</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Sunday, 1 November 2026 · nothing else on this screen can be done by anyone else</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <!-- decision 1 -->
  <rect x="288" y="136" width="1112" height="156" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="136" width="4" height="156" rx="2" fill="#B3261E"/>
  <text x="320" y="174" font-size="12" font-weight="700" fill="#B3261E" letter-spacing="1.2">PARCEL DOES NOT MATCH</text>
  <text x="320" y="210" font-size="20" font-weight="600" fill="#1C1917">Mahesh Soni's parcel is 138 mg short on pure gold</text>
  <text x="320" y="236" font-size="14" fill="#57534E">BATCH-2026-044 · 12 pieces held off the floor since Friday 4:10 pm</text>
  <text x="320" y="262" font-size="14" fill="#57534E">His last 6 parcels averaged 31 mg loss. This one is four times that.</text>
  <rect x="1012" y="178" width="172" height="44" rx="10" fill="#1C1917"/>
  <text x="1098" y="206" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Release to the floor</text>
  <rect x="1196" y="178" width="172" height="44" rx="10" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.6"/>
  <text x="1282" y="206" font-size="14" font-weight="600" fill="#B3261E" text-anchor="middle">Send it back</text>
  <text x="1368" y="248" font-size="13" fill="#8A8178" text-anchor="end">See the 12 tags and his ledger first</text>

  <!-- decision 2 -->
  <rect x="288" y="308" width="1112" height="124" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="308" width="4" height="124" rx="2" fill="#B35309"/>
  <text x="320" y="346" font-size="12" font-weight="700" fill="#8A4208" letter-spacing="1.2">STAFF WANTS A CODE</text>
  <text x="320" y="380" font-size="18" font-weight="600" fill="#1C1917">Rajesh wants to shave 40 mg off TAG-2026-8841</text>
  <text x="320" y="406" font-size="14" fill="#57534E">Antique Kundan Choker · reason given: fine-tuning the tag weight · asked 11:04, 2 minutes ago</text>
  <rect x="1012" y="348" width="172" height="44" rx="10" fill="#C9961F"/>
  <text x="1098" y="376" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Send the code</text>
  <rect x="1196" y="348" width="172" height="44" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1282" y="376" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Refuse</text>

  <!-- decision 3 -->
  <rect x="288" y="448" width="1112" height="124" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="448" width="4" height="124" rx="2" fill="#B35309"/>
  <text x="320" y="486" font-size="12" font-weight="700" fill="#8A4208" letter-spacing="1.2">GOLD SITTING TOO LONG</text>
  <text x="320" y="520" font-size="18" font-weight="600" fill="#1C1917">196.4 g of gold has not moved in 90 days</text>
  <text x="320" y="546" font-size="14" fill="#57534E">6 pieces, mostly Temple style · tied up on the floor · oldest is 108 days</text>
  <rect x="1012" y="488" width="172" height="44" rx="10" fill="#1C1917"/>
  <text x="1098" y="516" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Push on WhatsApp</text>
  <rect x="1196" y="488" width="172" height="44" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1282" y="516" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Melt and remake</text>

  <!-- the gold, once the decisions are made -->
  <text x="288" y="628" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHERE THE GOLD IS RIGHT NOW</text>

  <rect x="288" y="644" width="262" height="140" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <text x="312" y="676" font-size="13" fill="#8A8178">Pieces that went out in October</text>
  <text x="312" y="716" font-size="30" font-weight="700" fill="#1C1917">184</text>
  <text x="312" y="744" font-size="13" fill="#15603C">up 12% on September</text>
  <rect x="312" y="756" width="214" height="6" rx="3" fill="#F1EFEA"/>
  <rect x="312" y="756" width="160" height="6" rx="3" fill="#1D7A4C"/>

  <rect x="570" y="644" width="262" height="140" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <text x="594" y="676" font-size="13" fill="#8A8178">Gold on the floor</text>
  <text x="594" y="716" font-size="30" font-weight="700" fill="#1C1917">1,847 g</text>
  <text x="594" y="744" font-size="13" fill="#8A8178">42 pieces, ready to sell</text>

  <rect x="852" y="644" width="262" height="140" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <text x="876" y="676" font-size="13" fill="#8A8178">Gold with karigars</text>
  <text x="876" y="716" font-size="30" font-weight="700" fill="#1C1917">612 g</text>
  <text x="876" y="744" font-size="13" fill="#8A4208">7 open jobs · 2 past their date</text>

  <rect x="1134" y="644" width="266" height="140" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <text x="1158" y="676" font-size="13" fill="#8A8178">Metal lost this month</text>
  <text x="1158" y="716" font-size="30" font-weight="700" fill="#1C1917">0.71%</text>
  <text x="1158" y="736" font-size="13" fill="#8A8178">4.3 g across all jobs</text>
  <text x="1158" y="756" font-size="13" fill="#15603C">under your 0.8% allowance</text>

  <!-- karigar scorecard, ranked, no table chrome -->
  <text x="288" y="836" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">KARIGARS, WORST FIRST</text>
  <text x="1400" y="836" font-size="14" fill="#1C1917" text-anchor="end">All 9</text>
  <rect x="288" y="852" width="1112" height="104" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <circle cx="330" cy="890" r="17" fill="#FBE9E7"/>
  <text x="330" y="895" font-size="13" font-weight="700" fill="#B3261E" text-anchor="middle">MS</text>
  <text x="360" y="886" font-size="15" font-weight="600" fill="#1C1917">Mahesh Soni · KG-02</text>
  <text x="360" y="906" font-size="13" fill="#8A8178">Kundan and Polki · 3 open jobs</text>
  <text x="760" y="886" font-size="13" fill="#8A8178">Metal loss</text>
  <text x="760" y="908" font-size="18" font-weight="600" fill="#B3261E" font-family="ui-monospace, Menlo, monospace">1.42%</text>
  <text x="900" y="886" font-size="13" fill="#8A8178">Delivers</text>
  <text x="900" y="908" font-size="18" font-weight="600" fill="#B35309" font-family="ui-monospace, Menlo, monospace">+3.2 days late</text>
  <text x="1110" y="886" font-size="13" fill="#8A8178">Rating</text>
  <text x="1110" y="908" font-size="18" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">3.4 / 5</text>
  <rect x="1240" y="872" width="128" height="40" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1304" y="897" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Open ledger</text>
  <text x="312" y="944" font-size="13" fill="#8A8178">Lakshmi Devi and Vijay Kumar are both inside their allowance. Nothing to do there.</text>
</svg>
