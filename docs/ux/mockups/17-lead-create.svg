<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="mo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1C1917" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1440" height="920" fill="#EDEAE4"/>

  <text x="48" y="54" font-size="22" font-weight="600" fill="#1C1917">The two ways a lead enters, side by side</text>
  <text x="48" y="80" font-size="14" fill="#57534E">Left: a PO the system read for you, waiting for a glance. Right: one you type at the counter. Both end as the same lead.</text>

  <!-- ===== LEFT : PARSED PO REVIEW ===== -->
  <text x="48" y="128" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">CHECK WHAT THE SYSTEM READ</text>
  <rect x="48" y="144" width="664" height="712" rx="18" fill="#FFFFFF" filter="url(#mo)"/>

  <text x="80" y="186" font-size="18" font-weight="600" fill="#1C1917">Sharma wedding enquiry</text>
  <rect x="520" y="166" width="164" height="28" rx="14" fill="#FDF0E2"/>
  <text x="602" y="185" font-size="12" font-weight="700" fill="#8A4208" text-anchor="middle">2 fields to confirm</text>

  <!-- the original message -->
  <text x="80" y="224" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.2">WHAT THEY SENT ON WHATSAPP</text>
  <rect x="80" y="238" width="600" height="150" rx="12" fill="#F0F6EF" stroke="#CFE3CC"/>
  <text x="100" y="266" font-size="13" fill="#44403C">namaste, for sharma wedding need 2 temple</text>
  <text x="100" y="288" font-size="13" fill="#44403C">haram long chettinad type and one kundan</text>
  <text x="100" y="310" font-size="13" fill="#44403C">choker. haram around 80g each, choker you</text>
  <text x="100" y="332" font-size="13" fill="#44403C">suggest. need by 20 nov for engagement.</text>
  <text x="100" y="354" font-size="13" fill="#44403C">— Ramesh Sharma</text>
  <text x="100" y="378" font-size="12" fill="#8A8178">received 02:14, today · +91 98451 20034</text>

  <!-- extracted fields -->
  <text x="80" y="424" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.2">WHAT THE SYSTEM PULLED OUT · FIX ANYTHING WRONG</text>

  <text x="80" y="454" font-size="13" fill="#8A8178">Customer</text>
  <rect x="80" y="464" width="600" height="46" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="100" y="493" font-size="15" fill="#1C1917">Ramesh Sharma</text>
  <rect x="596" y="476" width="72" height="22" rx="11" fill="#E8F5EE"/>
  <text x="632" y="491" font-size="11" font-weight="600" fill="#15603C" text-anchor="middle">sure</text>

  <text x="80" y="534" font-size="13" fill="#8A8178">Wants</text>
  <rect x="80" y="544" width="600" height="46" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="100" y="573" font-size="15" fill="#1C1917">2 × Temple Haram (Chettinad), 1 × Kundan Choker</text>
  <rect x="596" y="556" width="72" height="22" rx="11" fill="#E8F5EE"/>
  <text x="632" y="571" font-size="11" font-weight="600" fill="#15603C" text-anchor="middle">sure</text>

  <text x="80" y="614" font-size="13" fill="#8A8178">Target weight on each haram</text>
  <rect x="80" y="624" width="600" height="46" rx="10" fill="#FFFFFF" stroke="#C9961F" stroke-width="2"/>
  <text x="100" y="653" font-size="15" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">80.000 g</text>
  <rect x="580" y="636" width="88" height="22" rx="11" fill="#FDF0E2"/>
  <text x="624" y="651" font-size="11" font-weight="700" fill="#8A4208" text-anchor="middle">check this</text>

  <text x="80" y="694" font-size="13" fill="#8A8178">Needed by</text>
  <rect x="80" y="704" width="600" height="46" rx="10" fill="#FFFFFF" stroke="#C9961F" stroke-width="2"/>
  <text x="100" y="733" font-size="15" font-weight="600" fill="#1C1917">20 Nov 2026</text>
  <rect x="580" y="716" width="88" height="22" rx="11" fill="#FDF0E2"/>
  <text x="624" y="731" font-size="11" font-weight="700" fill="#8A4208" text-anchor="middle">check this</text>

  <rect x="80" y="778" width="320" height="52" rx="10" fill="#1C1917"/>
  <text x="240" y="810" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Looks right — keep the lead</text>
  <rect x="412" y="778" width="136" height="52" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="480" y="810" font-size="15" font-weight="600" fill="#1C1917" text-anchor="middle">Not an order</text>

  <!-- ===== RIGHT : MANUAL CREATE ===== -->
  <text x="748" y="128" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">OR TYPE ONE AT THE COUNTER</text>
  <rect x="748" y="144" width="644" height="712" rx="18" fill="#FFFFFF" filter="url(#mo)"/>

  <text x="780" y="186" font-size="18" font-weight="600" fill="#1C1917">Add a lead by hand</text>
  <text x="780" y="208" font-size="13" fill="#8A8178">A walk-in or a phone call. Nothing to read, so nothing to check.</text>

  <text x="780" y="250" font-size="13" fill="#8A8178">Who is it?</text>
  <rect x="780" y="260" width="580" height="46" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="800" y="289" font-size="15" fill="#1C1917">Mrs Nair</text>
  <rect x="1200" y="272" width="144" height="22" rx="11" fill="#F1EFEA"/>
  <text x="1272" y="287" font-size="11" font-weight="600" fill="#57534E" text-anchor="middle">known customer ·</text>

  <text x="780" y="330" font-size="13" fill="#8A8178">Phone</text>
  <rect x="780" y="340" width="580" height="46" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="800" y="369" font-size="15" fill="#1C1917">+91 94440 22189</text>

  <text x="780" y="410" font-size="13" fill="#8A8178">What do they want?</text>
  <rect x="780" y="420" width="580" height="92" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="800" y="448" font-size="15" fill="#1C1917">A Polki choker like the one in the window,</text>
  <text x="800" y="470" font-size="15" fill="#1C1917">a little lighter. Likes green meena.</text>

  <text x="780" y="548" font-size="13" fill="#8A8178">Needed by (if they said)</text>
  <rect x="780" y="558" width="280" height="46" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="800" y="587" font-size="15" fill="#A8A29E">no date given</text>

  <text x="1080" y="548" font-size="13" fill="#8A8178">Attach a photo (optional)</text>
  <rect x="1080" y="558" width="280" height="46" rx="10" fill="#FFFFFF" stroke="#D6D1C8" stroke-dasharray="5 4"/>
  <text x="1220" y="587" font-size="14" fill="#57534E" text-anchor="middle">Add a picture</text>

  <rect x="780" y="640" width="580" height="60" rx="12" fill="#F1EFEA"/>
  <text x="800" y="666" font-size="13" font-weight="600" fill="#57534E">This becomes a lead straight away</text>
  <text x="800" y="686" font-size="13" fill="#57534E">It joins the same list and starts the same 8-hour clock.</text>

  <rect x="780" y="778" width="260" height="52" rx="10" fill="#1C1917"/>
  <text x="910" y="810" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Create the lead</text>
  <rect x="1052" y="778" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1112" y="810" font-size="15" font-weight="600" fill="#1C1917" text-anchor="middle">Cancel</text>

  <!-- footer -->
  <text x="48" y="892" font-size="13" fill="#8A8178">After either screen, the lead is worked the same way, and converting it is the next step — sell from stock, or send an order copy to a karigar (screens 18 and 19).</text>
</svg>
