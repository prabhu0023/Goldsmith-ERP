<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#FAF9F7"/>

  <!-- rail : owner -->
  <rect x="0" y="0" width="248" height="900" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="900" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">All branches</text>
  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">OVERSIGHT</text>
  <circle cx="40" cy="140" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="145" font-size="14" fill="#44403C">Decisions</text>
  <circle cx="40" cy="186" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="191" font-size="14" fill="#44403C">Money and stock</text>
  <circle cx="40" cy="230" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="235" font-size="14" fill="#44403C">Karigars</text>
  <rect x="12" y="252" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="274" r="7" fill="#C9961F"/>
  <text x="62" y="279" font-size="14" font-weight="600" fill="#FFFFFF">Rules and people</text>
  <line x1="12" y1="822" x2="236" y2="822" stroke="#E7E3DC"/>
  <circle cx="44" cy="870" r="18" fill="#E2DCD2"/>
  <text x="44" y="875" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">SS</text>
  <text x="72" y="864" font-size="14" font-weight="600" fill="#1C1917">Sanjay Seth</text>
  <text x="72" y="884" font-size="13" fill="#8A8178">Owner · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">Add a staff member</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Their role decides what they land on and what they may do. Every sale they make is counted to them.</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <!-- ===== LEFT : identity + login ===== -->
  <text x="288" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHO THEY ARE</text>
  <rect x="288" y="166" width="520" height="360" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="312" y="200" font-size="13" fill="#8A8178">Name</text>
  <rect x="312" y="210" width="472" height="48" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="332" y="240" font-size="15" fill="#1C1917">Deepak Rao</text>

  <text x="312" y="288" font-size="13" fill="#8A8178">Phone · they sign in and get OTPs here</text>
  <rect x="312" y="298" width="472" height="48" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="332" y="328" font-size="15" fill="#1C1917">+91 90030 71145</text>

  <text x="312" y="376" font-size="13" fill="#8A8178">Which counter / branch</text>
  <rect x="312" y="386" width="472" height="48" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="332" y="416" font-size="15" fill="#1C1917">Main showroom</text>

  <rect x="312" y="454" width="472" height="48" rx="10" fill="#FBF3E0" stroke="#EBD9A8"/>
  <text x="332" y="483" font-size="14" font-weight="600" fill="#8A4208">Sales will be counted to Deepak — used later for gamification</text>

  <!-- ===== RIGHT : role picker ===== -->
  <text x="840" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHAT ROLE · THIS SETS EVERYTHING ELSE</text>

  <rect x="840" y="166" width="552" height="88" rx="14" fill="#FFFFFF" stroke="#1C1917" stroke-width="2" filter="url(#sh)"/>
  <circle cx="874" cy="210" r="11" fill="none" stroke="#1C1917" stroke-width="2"/>
  <circle cx="874" cy="210" r="5" fill="#1C1917"/>
  <text x="900" y="204" font-size="16" font-weight="600" fill="#1C1917">Staff</text>
  <text x="900" y="228" font-size="13" fill="#8A8178">Showroom desk — leads, tagging, selling, proposing edits</text>
  <text x="1368" y="216" font-size="13" fill="#8A8178" text-anchor="end">lands on Today</text>

  <rect x="840" y="266" width="552" height="88" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <circle cx="874" cy="310" r="11" fill="none" stroke="#A8A29E" stroke-width="2"/>
  <text x="900" y="304" font-size="16" font-weight="600" fill="#1C1917">Owner</text>
  <text x="900" y="328" font-size="13" fill="#8A8178">Everything staff can do, plus clearing, applying edits, scrap</text>
  <text x="1368" y="316" font-size="13" fill="#8A8178" text-anchor="end">lands on Decisions</text>

  <rect x="840" y="366" width="552" height="88" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <circle cx="874" cy="410" r="11" fill="none" stroke="#A8A29E" stroke-width="2"/>
  <text x="900" y="404" font-size="16" font-weight="600" fill="#1C1917">Karigar</text>
  <text x="900" y="428" font-size="13" fill="#8A8178">Phone only — their own jobs, no prices, no customers</text>
  <text x="1368" y="416" font-size="13" fill="#8A8178" text-anchor="end">lands on My jobs</text>

  <text x="840" y="492" font-size="13" fill="#57534E">Three roles, no in-between. The permission list on the next card is fixed by the role — you do not tick boxes.</text>

  <!-- ===== what Staff can/cannot do, confirmed ===== -->
  <text x="288" y="582" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">SO DEEPAK, AS STAFF, WILL BE ABLE TO</text>
  <rect x="288" y="598" width="1104" height="180" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <g font-size="14" fill="#1C1917">
    <path d="M320 632 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="344" y="637">Work leads and convert them</text>
    <path d="M320 668 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="344" y="673">Tag pieces and run the checks</text>
    <path d="M320 704 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="344" y="709">Release a parcel that matches</text>
    <path d="M700 632 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="724" y="637">Sell from stock and stock-out</text>
    <path d="M700 668 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="724" y="673">Propose edits and request scrap</text>
    <path d="M700 704 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="724" y="709">Raise a problem to stop the line</text>
  </g>
  <g font-size="14" fill="#57534E">
    <path d="M1060 632 l12 12 M1072 632 l-12 12" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/>
    <text x="1088" y="643">Not: clear a mismatch</text>
    <path d="M1060 672 l12 12 M1072 672 l-12 12" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/>
    <text x="1088" y="683">Not: apply an edit</text>
    <path d="M1060 712 l12 12 M1072 712 l-12 12" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/>
    <text x="1088" y="723">Not: scrap a piece</text>
  </g>

  <!-- action -->
  <rect x="288" y="810" width="240" height="52" rx="10" fill="#1C1917"/>
  <text x="408" y="842" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Add this staff member</text>
  <rect x="544" y="810" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="604" y="842" font-size="15" font-weight="600" fill="#1C1917" text-anchor="middle">Cancel</text>
  <text x="760" y="842" font-size="13" fill="#8A8178">Only the owner can add staff or change a role.</text>
</svg>
