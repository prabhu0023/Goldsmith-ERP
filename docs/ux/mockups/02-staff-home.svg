  <text x="1376" y="190" font-size="22" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">1,847.2 g</text>
  <line x1="1044" y1="206" x2="1376" y2="206" stroke="#F1EFEA"/>

