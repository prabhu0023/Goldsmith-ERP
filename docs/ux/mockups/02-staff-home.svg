  <text x="1376" y="238" font-size="22" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">42</text>
  <line x1="1044" y1="254" x2="1376" y2="254" stroke="#F1EFEA"/>

