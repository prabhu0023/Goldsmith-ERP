  <text x="1376" y="286" font-size="22" font-weight="600" fill="#B35309" font-family="ui-monospace, Menlo, monospace" text-anchor="end">14</text>
  <line x1="1044" y1="302" x2="1376" y2="302" stroke="#F1EFEA"/>

  <text x="1044" y="332" font-size="13" fill="#8A8178">Pieces out today</text>
  <text x="1376" y="334" font-size="22" font-weight="600" fill="#15603C" font-family="ui-monospace, Menlo, monospace" text-anchor="end">11</text>

  <text x="1020" y="392" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">SAY HAPPY BIRTHDAY · 2</text>
  <rect x="1020" y="408" width="380" height="124" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <circle cx="1052" cy="444" r="16" fill="#E2DCD2"/>
  <text x="1052" y="449" font-size="12" font-weight="600" fill="#44403C" text-anchor="middle">PM</text>
  <text x="1080" y="440" font-size="14" font-weight="600" fill="#1C1917">Priya Malhotra · today</text>
  <text x="1080" y="459" font-size="13" fill="#8A8178">VIP Bridal · last bought Polki kada</text>
  <rect x="1300" y="428" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1340" y="449" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">Message</text>
  <line x1="1044" y1="478" x2="1376" y2="478" stroke="#F1EFEA"/>
  <circle cx="1052" cy="506" r="16" fill="#E2DCD2"/>
  <text x="1052" y="511" font-size="12" font-weight="600" fill="#44403C" text-anchor="middle">AK</text>
  <text x="1080" y="502" font-size="14" font-weight="600" fill="#1C1917">Arjun &amp; Kavya · anniversary</text>
  <text x="1080" y="521" font-size="13" fill="#8A8178">High net worth · 4 purchases</text>
  <rect x="1300" y="490" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1340" y="511" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">Message</text>

  <!-- note strip -->
  <rect x="1020" y="568" width="380" height="82" rx="14" fill="#F1EFEA"/>
  <text x="1044" y="600" font-size="13" font-weight="700" fill="#57534E" letter-spacing="0.8">WHY THIS SCREEN EXISTS</text>
  <text x="1044" y="622" font-size="13" fill="#57534E">Staff used to land on a 42-row table and</text>
  <text x="1044" y="640" font-size="13" fill="#57534E">guess what mattered. Now the day is a list.</text>
</svg>
