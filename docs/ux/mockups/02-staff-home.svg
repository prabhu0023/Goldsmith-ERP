  <circle cx="40" cy="318" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="323" font-size="14" fill="#44403C">Customers</text>

  <text x="24" y="376" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">OUTREACH</text>
  <circle cx="40" cy="406" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="411" font-size="14" fill="#44403C">Showcase on WhatsApp</text>

  <!-- role chip at bottom: the old simulation bar lives here -->
  <line x1="12" y1="782" x2="236" y2="782" stroke="#E7E3DC"/>
  <rect x="12" y="798" width="224" height="64" rx="12" fill="#FAF9F7" stroke="#E7E3DC"/>
  <circle cx="44" cy="830" r="18" fill="#E2DCD2"/>
  <text x="44" y="835" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">RV</text>
  <text x="72" y="824" font-size="14" font-weight="600" fill="#1C1917">Rajesh Verma</text>
  <text x="72" y="844" font-size="13" fill="#8A8178">Showroom staff · switch</text>
  <path d="M220 826 l6 6 l6 -6" fill="none" stroke="#8A8178" stroke-width="1.6" stroke-linecap="round"/>

