  <circle cx="796" cy="556" r="18" fill="#FBF3E0"/>
  <circle cx="796" cy="556" r="7" fill="none" stroke="#B8860B" stroke-width="2"/>
  <text x="788" y="604" font-size="16" font-weight="600" fill="#1C1917">Add a customer</text>
  <text x="788" y="626" font-size="13" fill="#8A8178">Name, phone and wishes.</text>

