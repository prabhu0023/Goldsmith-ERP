  <rect x="248" y="0" width="1192" height="88" fill="#FAF9F7"/>
  <line x1="248" y1="88" x2="1440" y2="88" stroke="#E7E3DC"/>
  <text x="288" y="44" font-size="24" font-weight="600" fill="#1C1917">Good morning, Rajesh</text>
