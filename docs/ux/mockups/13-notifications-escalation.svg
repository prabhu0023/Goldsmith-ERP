<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
    <filter id="mo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1C1917" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1440" height="1000" fill="#FAF9F7"/>

  <!-- rail -->
  <rect x="0" y="0" width="248" height="1000" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="1000" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">All branches</text>

  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">OVERSIGHT</text>
  <rect x="12" y="118" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="140" r="7" fill="#C9961F"/>
  <text x="62" y="145" font-size="14" font-weight="600" fill="#FFFFFF">Decisions</text>
  <rect x="196" y="131" width="28" height="20" rx="10" fill="#B3261E"/>
  <text x="210" y="145" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <circle cx="40" cy="186" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="191" font-size="14" fill="#44403C">Leads</text>
  <rect x="196" y="177" width="28" height="20" rx="10" fill="#FBE9E7"/>
  <text x="210" y="191" font-size="12" font-weight="700" fill="#B3261E" text-anchor="middle">2</text>
  <circle cx="40" cy="230" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="235" font-size="14" fill="#44403C">Money and stock</text>
  <circle cx="40" cy="274" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="279" font-size="14" fill="#44403C">Karigars</text>
  <circle cx="40" cy="318" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="323" font-size="14" fill="#44403C">Reports</text>
  <circle cx="40" cy="362" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="367" font-size="14" fill="#44403C">Rules and people</text>

  <line x1="12" y1="882" x2="236" y2="882" stroke="#E7E3DC"/>
  <circle cx="44" cy="930" r="18" fill="#E2DCD2"/>
  <text x="44" y="935" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">SS</text>
  <text x="72" y="924" font-size="14" font-weight="600" fill="#1C1917">Sanjay Seth</text>
  <text x="72" y="944" font-size="13" fill="#8A8178">Owner · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">Six things are waiting on you</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Only what nobody else may do. A parcel that matches never appears on this screen.</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <!-- ===== GROUP 1 ===== -->
  <text x="288" y="144" font-size="12" font-weight="700" fill="#B3261E" letter-spacing="1.4">NOTHING MOVES UNTIL YOU ANSWER · 4</text>

  <!-- card 1 : parcel mismatch -->
  <rect x="288" y="160" width="712" height="88" rx="14" fill="#FFFFFF" stroke="#B3261E" stroke-width="2" filter="url(#sh)"/>
  <circle cx="324" cy="204" r="16" fill="#FBE9E7"/>
  <text x="324" y="210" font-size="15" font-weight="700" fill="#B3261E" text-anchor="middle">!</text>
  <text x="356" y="190" font-size="15" font-weight="600" fill="#1C1917">BATCH-2026-044 will not weigh up · 138 mg short</text>
  <text x="356" y="212" font-size="13" fill="#57534E">Mahesh Soni · 12 pieces frozen · 447.162 g vs 447.300 g expected · submitted 09:12</text>
  <text x="356" y="232" font-size="13" fill="#8A8178">His last six parcels averaged 31 mg. Staff cannot release this one — only you can.</text>
  <rect x="852" y="184" width="124" height="40" rx="10" fill="#1C1917"/>
  <text x="914" y="209" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Open it</text>

  <!-- card 2 : karigar stopped -->
  <rect x="288" y="260" width="712" height="88" rx="14" fill="#FFFFFF" stroke="#B3261E" stroke-width="2" filter="url(#sh)"/>
  <circle cx="324" cy="304" r="16" fill="#FBE9E7"/>
  <text x="324" y="310" font-size="15" font-weight="700" fill="#B3261E" text-anchor="middle">!</text>
  <text x="356" y="290" font-size="15" font-weight="600" fill="#1C1917">Vijay Kumar stopped his own job MO-2026-118</text>
  <text x="356" y="312" font-size="13" fill="#57534E">"Two kemp stones cracked while setting. I need a replacement before I can finish."</text>
  <text x="356" y="332" font-size="13" fill="#8A8178">Raised from the bench 08:40 · due today · a karigar can stop the line too</text>
  <rect x="852" y="284" width="124" height="40" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="914" y="309" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Open it</text>

  <!-- card 3 : edits -->
  <rect x="288" y="360" width="712" height="88" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="360" width="4" height="88" rx="2" fill="#B35309"/>
  <text x="320" y="390" font-size="15" font-weight="600" fill="#1C1917">2 edits proposed on tags in stock</text>
  <text x="320" y="412" font-size="13" fill="#57534E">Rajesh wants 40 mg off TAG-8841 · Deepak wants the stone count changed on TAG-9012</text>
  <text x="320" y="432" font-size="13" fill="#8A8178">You read the change, a token comes to your WhatsApp, and you apply it. Staff never touch the field.</text>
  <rect x="852" y="384" width="124" height="40" rx="10" fill="#C9961F"/>
  <text x="914" y="409" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Read them</text>

  <!-- card 4 : scrap -->
  <rect x="288" y="460" width="712" height="88" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="460" width="4" height="88" rx="2" fill="#B35309"/>
  <text x="320" y="490" font-size="15" font-weight="600" fill="#1C1917">1 piece to be marked as scrap</text>
  <text x="320" y="512" font-size="13" fill="#57534E">Temple Nakshi Haram · 108 days unsold · 78.400 g pure gold · asked by Rajesh</text>
  <text x="320" y="532" font-size="13" fill="#8A8178">Marking it scrap closes the piece and puts its gold back in the metal pool to issue again.</text>
  <rect x="852" y="484" width="124" height="40" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="914" y="509" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Decide</text>

  <!-- ===== GROUP 2 ===== -->
  <text x="288" y="594" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">RUNNING LATE · 2 · THE CLOCK TOLD ME, NOT A PERSON</text>

  <rect x="288" y="610" width="712" height="72" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="610" width="4" height="72" rx="2" fill="#B3261E"/>
  <text x="320" y="640" font-size="15" font-weight="600" fill="#1C1917">2 leads nobody has opened for over 8 hours</text>
  <text x="320" y="662" font-size="13" fill="#57534E">Sharma wedding enquiry (11 h) · bulk chain order from Erode (9 h)</text>
  <rect x="852" y="626" width="124" height="40" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="914" y="651" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">See leads</text>

  <rect x="288" y="694" width="712" height="72" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="694" width="4" height="72" rx="2" fill="#B35309"/>
  <text x="320" y="724" font-size="15" font-weight="600" fill="#1C1917">2 karigar jobs past their agreed date</text>
  <text x="320" y="746" font-size="13" fill="#57534E">Mahesh Soni 3 days over · Lakshmi Devi 1 day over · both reminded automatically</text>
  <rect x="852" y="710" width="124" height="40" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="914" y="735" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">See tracker</text>

  <!-- ===== GROUP 3 : what went through without him ===== -->
  <text x="288" y="812" font-size="12" font-weight="700" fill="#15603C" letter-spacing="1.4">WENT THROUGH WITHOUT YOU TODAY · NO BUTTONS HERE</text>
  <rect x="288" y="828" width="712" height="88" rx="14" fill="#E8F5EE"/>
  <path d="M322 872 l6 6 l12 -13" fill="none" stroke="#1D7A4C" stroke-width="2.4" stroke-linecap="round"/>
  <text x="356" y="860" font-size="15" font-weight="600" fill="#15603C">3 parcels went live this morning without you</text>
  <text x="356" y="882" font-size="13" fill="#15603C">35 pieces · 1,284 g pure gold · all three matched, so the staff who tagged them released them</text>
  <text x="356" y="902" font-size="13" fill="#15603C">11 pieces went out · 4 wishes sent</text>

  <text x="288" y="952" font-size="13" fill="#8A8178">This block should be the long one. If it is ever short while the first block is long, something upstream is wrong — not your rule.</text>

  <!-- ===== RIGHT : RULES ===== -->
  <text x="1032" y="144" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">THE RULES BEHIND THESE ALERTS</text>
  <rect x="1032" y="160" width="368" height="446" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="1060" y="196" font-size="14" font-weight="600" fill="#1C1917">A lead is late after</text>
  <rect x="1060" y="208" width="110" height="48" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="1080" y="239" font-size="20" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">8</text>
  <text x="1152" y="239" font-size="14" fill="#8A8178" text-anchor="end">hours</text>
  <text x="1186" y="228" font-size="13" fill="#8A8178">shop hours, not</text>
  <text x="1186" y="246" font-size="13" fill="#8A8178">clock hours</text>

  <line x1="1060" y1="282" x2="1372" y2="282" stroke="#F1EFEA"/>
  <text x="1060" y="310" font-size="14" font-weight="600" fill="#1C1917">A parcel comes to me when</text>
  <rect x="1060" y="322" width="312" height="74" rx="10" fill="#F1EFEA"/>
  <text x="1080" y="348" font-size="14" font-weight="700" fill="#44403C">it does not match exactly</text>
  <text x="1080" y="370" font-size="13" fill="#57534E">Nothing for you to set. Every item tagged,</text>
  <text x="1080" y="388" font-size="13" fill="#57534E">and gross, stone and net all agree — or I see it.</text>

  <line x1="1060" y1="400" x2="1372" y2="400" stroke="#F1EFEA"/>
  <text x="1060" y="428" font-size="14" font-weight="600" fill="#1C1917">Who hears about a late lead</text>
  <rect x="1060" y="440" width="150" height="36" rx="18" fill="#1C1917"/>
  <text x="1135" y="463" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Staff first, then me</text>
  <rect x="1220" y="440" width="80" height="36" rx="18" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="1260" y="463" font-size="13" fill="#44403C" text-anchor="middle">Only me</text>

  <line x1="1060" y1="502" x2="1372" y2="502" stroke="#F1EFEA"/>
  <text x="1060" y="530" font-size="14" font-weight="600" fill="#1C1917">How it reaches me</text>
  <rect x="1060" y="542" width="100" height="36" rx="18" fill="#1C1917"/>
  <text x="1110" y="565" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">WhatsApp</text>
  <rect x="1170" y="542" width="90" height="36" rx="18" fill="#1C1917"/>
  <text x="1215" y="565" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">In the app</text>
  <rect x="1270" y="542" width="80" height="36" rx="18" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="1310" y="565" font-size="13" fill="#44403C" text-anchor="middle">Email</text>

  <!-- staff composer -->
  <text x="1032" y="662" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">AND THIS IS WHAT STAFF SEE</text>
  <rect x="1032" y="678" width="368" height="266" rx="16" fill="#FFFFFF" filter="url(#mo)"/>
  <text x="1060" y="716" font-size="17" font-weight="600" fill="#1C1917">Stop the line</text>
  <text x="1060" y="738" font-size="13" fill="#8A8178">BATCH-2026-044 · 12 pieces</text>

  <rect x="1060" y="754" width="312" height="44" rx="10" fill="#FBE9E7"/>
  <text x="1080" y="781" font-size="14" font-weight="600" fill="#8F1D17">Nothing moves until the owner clears it</text>

  <text x="1060" y="822" font-size="13" fill="#8A8178">What is wrong?</text>
  <rect x="1060" y="832" width="312" height="62" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="1080" y="856" font-size="13" fill="#44403C">Parcel is 138 mg under. Mahesh's last</text>
  <text x="1080" y="876" font-size="13" fill="#44403C">six averaged 31 mg. Please check.</text>

  <rect x="1060" y="906" width="200" height="44" rx="10" fill="#1C1917"/>
  <text x="1160" y="934" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tell the owner</text>
  <rect x="1272" y="906" width="100" height="44" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1322" y="934" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Cancel</text>
</svg>
