<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="1040" fill="#FAF9F7"/>

  <!-- header -->
  <rect x="0" y="0" width="1440" height="96" fill="#1C1917"/>
  <rect x="48" y="26" width="44" height="44" rx="10" fill="#C9961F"/>
  <text x="70" y="55" font-size="15" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="108" y="44" font-size="20" font-weight="600" fill="#FFFFFF">Three roles, and exactly what each one may do</text>
  <text x="108" y="68" font-size="14" fill="#A8A29E">The QC manager persona is gone. Checking is a stage inside the staff flow, and the owner is pulled in only when something does not add up.</text>
  <rect x="1240" y="34" width="152" height="28" rx="14" fill="#2F2A26"/>
  <text x="1316" y="53" font-size="12" font-weight="600" fill="#E7E3DC" text-anchor="middle">Phase 1 · v4</text>

  <!-- ===== THE RULE ===== -->
  <rect x="48" y="136" width="1344" height="116" rx="16" fill="#1C1917"/>
  <text x="80" y="176" font-size="12" font-weight="700" fill="#C9961F" letter-spacing="1.4">THE RULE THE WHOLE SYSTEM TURNS ON</text>
  <text x="80" y="214" font-size="26" font-weight="600" fill="#FFFFFF">Anyone can stop the line. Only the owner can start it again.</text>
  <text x="80" y="240" font-size="14" fill="#A8A29E">Staff and karigars can raise a problem on any parcel, job or piece, and nothing moves while it stands. Clearing a mismatch, applying an edit and marking a piece as scrap are the owner's signature alone. Everything that simply adds up stays with staff.</text>

  <!-- ===== ROLE CARDS ===== -->
  <text x="48" y="300" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHO DOES WHAT</text>

  <!-- STAFF -->
  <rect x="48" y="316" width="432" height="470" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <circle cx="86" cy="356" r="20" fill="#E2DCD2"/>
  <text x="86" y="362" font-size="14" font-weight="600" fill="#44403C" text-anchor="middle">ST</text>
  <text x="120" y="350" font-size="18" font-weight="600" fill="#1C1917">Staff</text>
  <text x="120" y="372" font-size="13" fill="#8A8178">Showroom desk · lands on Today</text>

  <text x="76" y="412" font-size="12" font-weight="700" fill="#15603C" letter-spacing="1.2">CAN</text>
  <g font-size="14" fill="#1C1917">
    <path d="M78 432 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="437">Work a lead and convert it</text>
    <path d="M78 460 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="465">Raise an order copy to a karigar</text>
    <path d="M78 488 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="493">Record an arriving parcel and its weights</text>
    <path d="M78 516 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="521">Tag every piece — saved as draft</text>
    <path d="M78 544 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="549" font-weight="600">Release a parcel that matches, into stock</text>
    <path d="M78 572 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="577">Raise a problem and stop the line</text>
    <path d="M78 600 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="605">Sell anything already in stock</text>
    <path d="M78 628 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="633">Propose an edit, and ask for a scrap</text>
    <path d="M78 656 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="661">Add a customer and send wishes</text>
  </g>

  <line x1="76" y1="684" x2="452" y2="684" stroke="#F1EFEA"/>
  <text x="76" y="710" font-size="12" font-weight="700" fill="#B3261E" letter-spacing="1.2">CANNOT</text>
  <g font-size="14" fill="#57534E">
    <path d="M78 727 l12 12 M90 727 l-12 12" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="738">Release a parcel whose weights disagree</text>
    <path d="M78 755 l12 12 M90 755 l-12 12" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/>
    <text x="102" y="766">Apply their own edit, or scrap a piece</text>
  </g>

  <!-- OWNER -->
  <rect x="504" y="316" width="432" height="470" rx="16" fill="#FFFFFF" stroke="#C9961F" stroke-width="2" filter="url(#sh)"/>
  <circle cx="542" cy="356" r="20" fill="#FBF3E0"/>
  <text x="542" y="362" font-size="14" font-weight="600" fill="#8A4208" text-anchor="middle">OW</text>
  <text x="576" y="350" font-size="18" font-weight="600" fill="#1C1917">Owner</text>
  <text x="576" y="372" font-size="13" fill="#8A8178">Lands on Decisions · handles exceptions</text>

  <text x="532" y="412" font-size="12" font-weight="700" fill="#15603C" letter-spacing="1.2">EVERYTHING STAFF CAN DO, PLUS</text>
  <g font-size="14" fill="#1C1917">
    <path d="M534 432 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="558" y="437" font-weight="600">Clear a parcel whose weights disagree</text>
    <path d="M534 460 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="558" y="465" font-weight="600">Clear any raised problem</text>
    <path d="M534 488 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="558" y="493" font-weight="600">Apply a proposed edit, with a token</text>
    <path d="M534 516 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="558" y="521" font-weight="600">Mark a piece as scrap and reuse its gold</text>
    <path d="M534 544 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="558" y="549">Send a parcel back to the karigar</text>
    <path d="M534 572 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="558" y="577">Onboard staff and karigars</text>
    <path d="M534 600 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="558" y="605">Set the lead timer and the rules</text>
    <path d="M534 628 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="558" y="633">Read every section's report</text>
  </g>

  <line x1="532" y1="662" x2="908" y2="662" stroke="#F1EFEA"/>
  <rect x="532" y="678" width="376" height="90" rx="12" fill="#FBF3E0"/>
  <text x="552" y="704" font-size="13" font-weight="700" fill="#8A4208">WHY HE IS NOT A BOTTLENECK</text>
  <text x="552" y="726" font-size="13" fill="#8A4208">A parcel that matches never reaches him; staff</text>
  <text x="552" y="744" font-size="13" fill="#8A4208">release it. He is pulled in only for a mismatch, a</text>
  <text x="552" y="762" font-size="13" fill="#8A4208">proposed edit, or a piece going to scrap.</text>

  <!-- KARIGAR -->
  <rect x="960" y="316" width="432" height="470" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <circle cx="998" cy="356" r="20" fill="#E2DCD2"/>
  <text x="998" y="362" font-size="14" font-weight="600" fill="#44403C" text-anchor="middle">KG</text>
  <text x="1032" y="350" font-size="18" font-weight="600" fill="#1C1917">Karigar</text>
  <text x="1032" y="372" font-size="13" fill="#8A8178">Phone only · lands on My jobs</text>

  <text x="988" y="412" font-size="12" font-weight="700" fill="#15603C" letter-spacing="1.2">CAN</text>
  <g font-size="14" fill="#1C1917">
    <path d="M990 432 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="437">See the jobs issued to him, and only those</text>
    <path d="M990 460 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="465">Accept a job and confirm the due date</text>
    <path d="M990 488 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="493">See target weights and the reference photo</text>
    <path d="M990 516 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="521">See the gold issued to him and his wastage</text>
    <path d="M990 544 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="549">Update status and add a bench photo</text>
    <path d="M990 572 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="577">Mark ready and hand the parcel over</text>
    <path d="M990 600 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="605">Raise a problem on his own job</text>
  </g>

  <line x1="988" y1="634" x2="1364" y2="634" stroke="#F1EFEA"/>
  <text x="988" y="660" font-size="12" font-weight="700" fill="#B3261E" letter-spacing="1.2">NEVER SEES</text>
  <g font-size="14" fill="#57534E">
    <path d="M990 677 l12 12 M1002 677 l-12 12" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="688">Prices, margins or invoices</text>
    <path d="M990 705 l12 12 M1002 705 l-12 12" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="716">Customers, leads or stock</text>
    <path d="M990 733 l12 12 M1002 733 l-12 12" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/>
    <text x="1014" y="744">Any other karigar's work or scorecard</text>
  </g>

  <!-- ===== WHAT HAPPENED TO QC ===== -->
  <text x="48" y="836" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHERE THE OLD QC MANAGER WENT</text>
  <rect x="48" y="852" width="1344" height="148" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <rect x="80" y="880" width="300" height="92" rx="12" fill="#F1EFEA"/>
  <text x="100" y="908" font-size="13" font-weight="700" fill="#57534E">BEFORE · A PERSON</text>
  <text x="100" y="932" font-size="14" fill="#44403C">QC manager held a queue and</text>
  <text x="100" y="952" font-size="14" fill="#44403C">approved pieces onto the floor.</text>

  <path d="M400 926 l28 0 M420 918 l10 8 l-10 8" fill="none" stroke="#8A8178" stroke-width="2" stroke-linecap="round"/>

  <rect x="448" y="880" width="440" height="92" rx="12" fill="#E8F5EE"/>
  <text x="468" y="908" font-size="13" font-weight="700" fill="#15603C">NOW · A STAGE INSIDE THE STAFF FLOW</text>
  <text x="468" y="932" font-size="14" fill="#15603C">The same three checks — scale agrees, hallmark is on the piece,</text>
  <text x="468" y="952" font-size="14" fill="#15603C">deductions look honest — are run by the staff member tagging.</text>

  <path d="M908 926 l28 0 M928 918 l10 8 l-10 8" fill="none" stroke="#8A8178" stroke-width="2" stroke-linecap="round"/>

  <rect x="956" y="880" width="404" height="92" rx="12" fill="#FBF3E0"/>
  <text x="976" y="908" font-size="13" font-weight="700" fill="#8A4208">AND ONLY EXCEPTIONS GO UP</text>
  <text x="976" y="932" font-size="14" fill="#8A4208">Checks passed on a parcel that matches means</text>
  <text x="976" y="952" font-size="14" fill="#8A4208">straight into stock. A mismatch goes to the owner.</text>
</svg>
