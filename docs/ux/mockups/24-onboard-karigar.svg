<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#FAF9F7"/>

  <!-- rail : owner -->
  <rect x="0" y="0" width="248" height="900" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="900" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">All branches</text>
  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">OVERSIGHT</text>
  <circle cx="40" cy="140" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="145" font-size="14" fill="#44403C">Decisions</text>
  <circle cx="40" cy="186" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="191" font-size="14" fill="#44403C">Money and stock</text>
  <rect x="12" y="208" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="230" r="7" fill="#C9961F"/>
  <text x="62" y="235" font-size="14" font-weight="600" fill="#FFFFFF">Karigars</text>
  <circle cx="40" cy="274" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="279" font-size="14" fill="#44403C">Rules and people</text>
  <line x1="12" y1="822" x2="236" y2="822" stroke="#E7E3DC"/>
  <circle cx="44" cy="870" r="18" fill="#E2DCD2"/>
  <text x="44" y="875" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">SS</text>
  <text x="72" y="864" font-size="14" font-weight="600" fill="#1C1917">Sanjay Seth</text>
  <text x="72" y="884" font-size="13" fill="#8A8178">Owner · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">Add a karigar</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">An artisan you issue gold to. The wastage you allow here is what every one of their parcels is judged against.</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <!-- ===== LEFT : identity ===== -->
  <text x="288" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHO THEY ARE</text>
  <rect x="288" y="166" width="640" height="400" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="312" y="200" font-size="13" fill="#8A8178">Name</text>
  <rect x="312" y="210" width="380" height="48" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="332" y="240" font-size="15" fill="#1C1917">Lakshmi Devi</text>
  <text x="716" y="200" font-size="13" fill="#8A8178">Code</text>
  <rect x="716" y="210" width="188" height="48" rx="10" fill="#FBF3E0" stroke="#EBD9A8"/>
  <text x="736" y="240" font-size="15" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">KG-01</text>

  <text x="312" y="288" font-size="13" fill="#8A8178">Phone · their job portal logs in with this</text>
  <rect x="312" y="298" width="380" height="48" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="332" y="328" font-size="15" fill="#1C1917">+91 94431 55082</text>
  <text x="716" y="288" font-size="13" fill="#8A8178">Workshop location</text>
  <rect x="716" y="298" width="188" height="48" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="736" y="328" font-size="15" fill="#1C1917">Kanchipuram</text>

  <text x="312" y="376" font-size="13" fill="#8A8178">What they are best at</text>
  <rect x="312" y="386" width="160" height="40" rx="20" fill="#1C1917"/>
  <text x="392" y="411" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Chettinad</text>
  <rect x="484" y="386" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="544" y="411" font-size="13" fill="#44403C" text-anchor="middle">Temple</text>
  <rect x="616" y="386" width="110" height="40" rx="20" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="671" y="411" font-size="13" fill="#44403C" text-anchor="middle">Kundan</text>
  <rect x="738" y="386" width="100" height="40" rx="20" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="788" y="411" font-size="13" fill="#44403C" text-anchor="middle">Polki</text>

  <text x="312" y="466" font-size="13" fill="#8A8178">Language for their phone</text>
  <rect x="312" y="476" width="110" height="40" rx="20" fill="#1C1917"/>
  <text x="367" y="501" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">தமிழ்</text>
  <rect x="434" y="476" width="110" height="40" rx="20" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="489" y="501" font-size="13" fill="#44403C" text-anchor="middle">हिन्दी</text>
  <rect x="556" y="476" width="130" height="40" rx="20" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="621" y="501" font-size="13" fill="#44403C" text-anchor="middle">English</text>

  <!-- ===== RIGHT : the wastage allowance — the key number ===== -->
  <text x="952" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">THE WASTAGE YOU ALLOW THEM</text>
  <rect x="952" y="166" width="440" height="400" rx="16" fill="#FFFFFF" stroke="#C9961F" stroke-width="2" filter="url(#sh)"/>

  <text x="976" y="206" font-size="14" fill="#57534E">How much metal they may lose, as a share of gold issued</text>
  <rect x="976" y="222" width="392" height="86" rx="12" fill="#FBF3E0"/>
  <text x="996" y="250" font-size="12" font-weight="700" fill="#8A4208" letter-spacing="1.2">ALLOWED LOSS</text>
  <text x="996" y="290" font-size="30" font-weight="700" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">0.70%</text>
  <text x="1348" y="290" font-size="13" fill="#8A4208" text-anchor="end">of gold issued</text>

  <!-- slider -->
  <text x="976" y="344" font-size="13" fill="#8A8178">0.6%</text>
  <text x="1348" y="344" font-size="13" fill="#8A8178" text-anchor="end">1.2%</text>
  <rect x="976" y="352" width="392" height="8" rx="4" fill="#F1EFEA"/>
  <rect x="976" y="352" width="66" height="8" rx="4" fill="#C9961F"/>
  <circle cx="1042" cy="356" r="12" fill="#1C1917"/>
  <text x="976" y="388" font-size="13" fill="#8A8178">The usual range for hand-made work. You can move it per karigar.</text>

  <line x1="976" y1="416" x2="1368" y2="416" stroke="#F1EFEA"/>

  <text x="976" y="448" font-size="13" fill="#8A8178">On a 160 g job, that means</text>
  <text x="976" y="476" font-size="20" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">up to 1.120 g lost</text>
  <text x="976" y="498" font-size="13" fill="#57534E">More than that against a job, and it is flagged to you.</text>

  <rect x="976" y="518" width="392" height="30" rx="8" fill="#F1EFEA"/>
  <text x="992" y="538" font-size="12" fill="#57534E">This feeds their scorecard — loss %, punctuality, rating — over time.</text>

  <!-- footer note -->
  <text x="288" y="612" font-size="13" fill="#8A8178">A karigar's identity drives their phone portal (mockup 09) and the order-copy assignment (mockup 19). The wastage set here is the window shown on every job sheet.</text>

  <!-- action -->
  <rect x="288" y="660" width="240" height="52" rx="10" fill="#1C1917"/>
  <text x="408" y="692" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Add this karigar</text>
  <rect x="544" y="660" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="604" y="692" font-size="15" font-weight="600" fill="#1C1917" text-anchor="middle">Cancel</text>
  <text x="288" y="744" font-size="13" fill="#8A8178">Only the owner can add a karigar or change their wastage allowance.</text>
</svg>
