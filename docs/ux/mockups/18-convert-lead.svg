<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#FAF9F7"/>

  <!-- rail -->
  <rect x="0" y="0" width="248" height="900" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="900" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">Main showroom</text>
  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">WORK</text>
  <circle cx="40" cy="140" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="145" font-size="14" fill="#44403C">Today</text>
  <rect x="12" y="164" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="186" r="7" fill="#C9961F"/>
  <text x="62" y="191" font-size="14" font-weight="600" fill="#FFFFFF">Leads</text>
  <circle cx="40" cy="230" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="235" font-size="14" fill="#44403C">Showroom stock</text>
  <circle cx="40" cy="274" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="279" font-size="14" fill="#44403C">Sell</text>
  <circle cx="40" cy="318" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="323" font-size="14" fill="#44403C">Parcels in</text>
  <line x1="12" y1="782" x2="236" y2="782" stroke="#E7E3DC"/>
  <circle cx="44" cy="830" r="18" fill="#E2DCD2"/>
  <text x="44" y="835" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">RV</text>
  <text x="72" y="824" font-size="14" font-weight="600" fill="#1C1917">Rajesh Verma</text>
  <text x="72" y="844" font-size="13" fill="#8A8178">Showroom staff · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">Sharma wedding · what happens to this lead?</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Ramesh Sharma · 2 Temple Harams and 1 Kundan Choker · needed by 20 Nov</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <text x="288" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">TWO WAYS TO MEET IT · PER ITEM, SO A LEAD CAN SPLIT BOTH WAYS</text>

  <!-- the lead's three items, each routed -->
  <!-- item 1 : haram, to be made -->
  <rect x="288" y="166" width="1104" height="110" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="312" y="190" width="60" height="60" rx="10" fill="#EFE9DF"/>
  <path d="M342 206 l20 34 h-40 z" fill="#D9CBB2"/>
  <text x="392" y="208" font-size="16" font-weight="600" fill="#1C1917">Temple Haram · Chettinad · ×2</text>
  <text x="392" y="230" font-size="13" fill="#8A8178">around 80 g each · nothing like it in stock right now</text>
  <text x="392" y="252" font-size="13" fill="#8A4208">best made fresh</text>
  <rect x="936" y="196" width="200" height="48" rx="10" fill="#C9961F"/>
  <text x="1036" y="225" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Make it — order to karigar</text>
  <rect x="1152" y="196" width="216" height="48" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1260" y="225" font-size="14" font-weight="600" fill="#57534E" text-anchor="middle">Sell from stock</text>

  <!-- item 2 : choker, in stock -->
  <rect x="288" y="288" width="1104" height="110" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="312" y="312" width="60" height="60" rx="10" fill="#EFE9DF"/>
  <circle cx="342" cy="342" r="18" fill="#E2D8C6"/>
  <text x="392" y="330" font-size="16" font-weight="600" fill="#1C1917">Kundan Choker · ×1</text>
  <text x="392" y="352" font-size="13" fill="#8A8178">TAG-8841 matches what they described · 41.590 g, in the showcase</text>
  <text x="392" y="374" font-size="13" fill="#15603C">already here — no need to make it</text>
  <rect x="936" y="318" width="200" height="48" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1036" y="347" font-size="14" font-weight="600" fill="#57534E" text-anchor="middle">Make it — order to karigar</text>
  <rect x="1152" y="318" width="216" height="48" rx="10" fill="#1C1917"/>
  <text x="1260" y="347" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Hold TAG-8841 for them</text>

  <!-- what each choice does -->
  <text x="288" y="454" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHAT EACH CHOICE SETS IN MOTION</text>

  <rect x="288" y="470" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#C9961F" stroke-width="2" filter="url(#sh)"/>
  <rect x="312" y="494" width="180" height="30" rx="15" fill="#FBF3E0"/>
  <text x="402" y="514" font-size="13" font-weight="700" fill="#8A4208" text-anchor="middle">Make it</text>
  <text x="312" y="556" font-size="16" font-weight="600" fill="#1C1917">An order copy goes to a karigar</text>
  <text x="312" y="584" font-size="14" fill="#57534E">You build the work order next: reference images, the</text>
  <text x="312" y="606" font-size="14" fill="#57534E">brief, target weights, who makes it, the due date and</text>
  <text x="312" y="628" font-size="14" fill="#57534E">the gold issued to them.</text>
  <text x="312" y="664" font-size="13" fill="#8A8178">It becomes a job on the karigar's phone, and the lead</text>
  <text x="312" y="684" font-size="13" fill="#8A8178">stays attached so the customer can be told when it is ready.</text>
  <rect x="312" y="706" width="240" height="44" rx="10" fill="#1C1917"/>
  <text x="432" y="734" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Build the order copy</text>

  <rect x="852" y="470" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#1D7A4C" stroke-width="2" filter="url(#sh)"/>
  <rect x="876" y="494" width="200" height="30" rx="15" fill="#E8F5EE"/>
  <text x="976" y="514" font-size="13" font-weight="700" fill="#15603C" text-anchor="middle">Sell from stock</text>
  <text x="876" y="556" font-size="16" font-weight="600" fill="#1C1917">The piece is held for this customer</text>
  <text x="876" y="584" font-size="14" fill="#57534E">It leaves the showcase and other quotes cannot see it.</text>
  <text x="876" y="606" font-size="14" fill="#57534E">When they come in, it goes straight to the stock-out —</text>
  <text x="876" y="628" font-size="14" fill="#57534E">seller, reference, invoice number.</text>
  <text x="876" y="664" font-size="13" fill="#8A8178">If they walk away, the hold is released and the piece</text>
  <text x="876" y="684" font-size="13" fill="#8A8178">returns to the showcase. No making involved.</text>
  <rect x="876" y="706" width="240" height="44" rx="10" fill="#1C1917"/>
  <text x="996" y="734" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Hold it and go to sell</text>

  <text x="288" y="812" font-size="13" fill="#57534E">This lead splits: the choker is held from stock, the two harams go to a karigar. One lead, two paths, both tracked against it.</text>
  <text x="288" y="836" font-size="13" fill="#8A8178">The lead is only "converted" once every item on it has been routed one way or the other.</text>
</svg>
