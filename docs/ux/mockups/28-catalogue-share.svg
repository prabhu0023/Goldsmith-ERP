  <text x="324" y="426" font-size="12" fill="#8A8178">TAG-8841 · 22K</text>
  <text x="324" y="448" font-size="13" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">41.590 g</text>

  <rect x="536" y="250" width="200" height="210" rx="12" fill="#FFFFFF" stroke="#C9961F" stroke-width="2"/>
  <rect x="548" y="262" width="176" height="120" rx="8" fill="#EFE9DF"/>
  <circle cx="636" cy="322" r="30" fill="none" stroke="#D9CBB2" stroke-width="10"/>
  <circle cx="714" cy="272" r="13" fill="#C9961F"/>
  <path d="M708 272 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
