  <text x="324" y="654" font-size="12" fill="#8A8178">TAG-7914 · 22K</text>
  <text x="324" y="676" font-size="13" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">15.100 g</text>

