  <text x="72" y="884" font-size="13" fill="#8A8178">Showroom staff · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">Share a set of pieces</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Pick from in-stock pieces, make a little showcase, and send it. Photos and weights go — never a price.</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <!-- ===== LEFT : pick pieces ===== -->
  <text x="288" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">PICK FROM WHAT IS IN STOCK · 4 CHOSEN</text>
  <rect x="288" y="166" width="700" height="560" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <!-- search -->
  <rect x="312" y="190" width="652" height="40" rx="10" fill="#FAF9F7" stroke="#E7E3DC"/>
  <circle cx="336" cy="210" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <path d="M341 215 l6 6" stroke="#8A8178" stroke-width="1.6" stroke-linecap="round"/>
  <text x="354" y="215" font-size="14" fill="#8A8178">filter by style, collection, weight…</text>

