  <rect x="548" y="490" width="176" height="120" rx="8" fill="#EFE9DF"/>
  <circle cx="636" cy="550" r="22" fill="none" stroke="#D9CBB2" stroke-width="8"/>
  <circle cx="714" cy="500" r="13" fill="#C9961F"/>
  <path d="M708 500 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="548" y="634" font-size="14" font-weight="600" fill="#1C1917">Emerald Ring</text>
  <text x="548" y="654" font-size="12" fill="#8A8178">TAG-9040 · 18K</text>
  <text x="548" y="676" font-size="13" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">12.600 g</text>

  <rect x="760" y="478" width="200" height="210" rx="12" fill="#FFFFFF" stroke="#E7E3DC"/>
  <rect x="772" y="490" width="176" height="120" rx="8" fill="#EFE9DF"/>
  <circle cx="860" cy="550" r="26" fill="#E2D8C6"/>
  <circle cx="938" cy="500" r="13" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="772" y="634" font-size="14" font-weight="600" fill="#1C1917">Meena Pendant</text>
  <text x="772" y="654" font-size="12" fill="#8A8178">TAG-9108 · 22K</text>
  <text x="772" y="676" font-size="13" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">22.300 g</text>

  <!-- ===== RIGHT : how it is shared ===== -->
  <text x="1032" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">HOW TO SEND IT</text>
  <rect x="1032" y="166" width="360" height="300" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="1056" y="200" font-size="14" font-weight="600" fill="#1C1917">A showcase of 4 pieces</text>
  <text x="1056" y="222" font-size="13" fill="#8A8178">172.780 g of pure gold across them · no price shown</text>

  <rect x="1056" y="244" width="312" height="52" rx="10" fill="#1C1917"/>
  <text x="1082" y="275" font-size="14" font-weight="600" fill="#FFFFFF">Send to a broadcast audience</text>
  <path d="M1340 264 l8 8 l-8 8" fill="none" stroke="#C9961F" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1056" y="322" font-size="13" fill="#8A8178">reuses the audience picker from Broadcast</text>

  <rect x="1056" y="344" width="150" height="48" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1131" y="374" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">To one person</text>
  <rect x="1218" y="344" width="150" height="48" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1293" y="374" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Copy a link</text>

  <rect x="1056" y="408" width="312" height="40" rx="8" fill="#E8F5EE"/>
  <text x="1072" y="433" font-size="13" font-weight="600" fill="#15603C">Replies land in the lead inbox as new leads</text>

  <!-- the image sent -->
  <text x="1032" y="504" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHAT A PIECE LOOKS LIKE TO THEM</text>
  <rect x="1032" y="520" width="360" height="206" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="1056" y="544" width="130" height="130" rx="10" fill="#EFE9DF"/>
  <circle cx="1121" cy="609" r="34" fill="#E2D8C6"/>
  <text x="1210" y="576" font-size="15" font-weight="600" fill="#1C1917">Antique Kundan Choker</text>
  <text x="1210" y="600" font-size="13" fill="#8A8178">22K · Kundan · Festive Bridal</text>
  <text x="1210" y="628" font-size="13" fill="#8A8178">Pure gold</text>
  <text x="1210" y="650" font-size="18" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">41.590 g</text>
  <text x="1210" y="690" font-size="12" fill="#A8A29E" font-style="italic">price added here once pricing is on</text>

  <!-- footer -->
  <text x="288" y="770" font-size="13" fill="#8A8178">This is the second broadcast mechanism you asked for — the product file. Only in-stock pieces can be shared, so nothing sold or scrapped ever goes out.</text>
  <text x="288" y="794" font-size="13" fill="#8A8178">Like everything else, a price can appear here later without changing the layout — the slot is already in the piece card.</text>
</svg>
