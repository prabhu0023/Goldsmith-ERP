  <text x="548" y="426" font-size="12" fill="#8A8178">TAG-8802 · 22K</text>
  <text x="548" y="448" font-size="13" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">57.490 g</text>

  <rect x="760" y="250" width="200" height="210" rx="12" fill="#FFFFFF" stroke="#E7E3DC"/>
  <rect x="772" y="262" width="176" height="120" rx="8" fill="#EFE9DF"/>
  <path d="M860 290 l24 40 h-48 z" fill="#D9CBB2"/>
  <circle cx="938" cy="272" r="13" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="772" y="406" font-size="14" font-weight="600" fill="#1C1917">Temple Haram</text>
  <text x="772" y="426" font-size="12" fill="#8A8178">TAG-7521 · 22K</text>
  <text x="772" y="448" font-size="13" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">78.400 g</text>

  <!-- row 2 -->
  <rect x="312" y="478" width="200" height="210" rx="12" fill="#FFFFFF" stroke="#C9961F" stroke-width="2"/>
  <rect x="324" y="490" width="176" height="120" rx="8" fill="#EFE9DF"/>
  <circle cx="412" cy="550" r="26" fill="#E2D8C6"/>
  <circle cx="490" cy="500" r="13" fill="#C9961F"/>
