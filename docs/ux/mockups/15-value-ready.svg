<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="1020" fill="#FAF9F7"/>

  <!-- header -->
  <rect x="0" y="0" width="1440" height="96" fill="#1C1917"/>
  <rect x="48" y="26" width="44" height="44" rx="10" fill="#C9961F"/>
  <text x="70" y="55" font-size="15" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="108" y="44" font-size="20" font-weight="600" fill="#FFFFFF">Built for prices. Showing none yet.</text>
  <text x="108" y="68" font-size="14" fill="#A8A29E">Every place a value will live is already shaped for it. One switch fills the sockets later — no screen is redrawn.</text>
  <rect x="1240" y="34" width="152" height="28" rx="14" fill="#2F2A26"/>
  <text x="1316" y="53" font-size="12" font-weight="600" fill="#E7E3DC" text-anchor="middle">Phase 1 · the facility</text>

  <!-- the switch -->
  <rect x="48" y="128" width="1344" height="104" rx="16" fill="#1C1917"/>
  <text x="80" y="166" font-size="12" font-weight="700" fill="#C9961F" letter-spacing="1.4">ONE SWITCH, OWNER-LEVEL, DEFAULTS OFF</text>
  <text x="80" y="200" font-size="20" font-weight="600" fill="#FFFFFF">Pricing</text>
  <rect x="190" y="182" width="64" height="30" rx="15" fill="#44403C"/>
  <circle cx="206" cy="197" r="11" fill="#A8A29E"/>
  <text x="268" y="202" font-size="15" font-weight="600" fill="#A8A29E">Off today</text>
  <text x="80" y="222" font-size="13" fill="#8A8178">The weight fields never depend on it. Turning it on only reveals value; it changes no layout and touches no gram.</text>
  <text x="1360" y="196" font-size="14" fill="#A8A29E" text-anchor="end">Data model already carries the fields — nullable, unused</text>

  <!-- ===== LEFT : OFF ===== -->
  <text x="48" y="282" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHAT STAFF SEE NOW · PRICING OFF</text>

  <!-- stock card off -->
  <rect x="48" y="298" width="300" height="300" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="64" y="314" width="268" height="150" rx="10" fill="#EFE9DF"/>
  <circle cx="198" cy="389" r="42" fill="#E2D8C6"/>
  <rect x="76" y="326" width="112" height="28" rx="14" fill="#E8F5EE"/>
  <circle cx="94" cy="340" r="4" fill="#1D7A4C"/>
  <text x="106" y="345" font-size="13" font-weight="600" fill="#15603C">In stock</text>
  <text x="64" y="492" font-size="16" font-weight="600" fill="#1C1917">Antique Kundan Choker</text>
  <text x="64" y="514" font-size="13" fill="#8A8178">TAG-8841 · 22K · Kundan</text>
  <line x1="64" y1="532" x2="332" y2="532" stroke="#F1EFEA"/>
  <text x="64" y="558" font-size="13" fill="#8A8178">Pure gold</text>
  <text x="332" y="560" font-size="20" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">41.590 g</text>
  <text x="64" y="582" font-size="13" fill="#8A8178">Gross · stones</text>
  <text x="332" y="583" font-size="14" font-weight="600" fill="#1C1917" text-anchor="end">48.650 g · 7.060 g</text>

  <!-- the socket, drawn as a ghost so you can see where value will land -->
  <rect x="48" y="614" width="300" height="52" rx="10" fill="none" stroke="#D6D1C8" stroke-dasharray="5 4"/>
  <text x="198" y="645" font-size="13" fill="#A8A29E" text-anchor="middle" font-style="italic">value socket · empty, takes no space when live</text>

  <!-- owner stat off -->
  <rect x="380" y="298" width="300" height="140" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <text x="404" y="330" font-size="13" fill="#8A8178">Gold on the floor</text>
  <text x="404" y="372" font-size="30" font-weight="700" fill="#1C1917">1,847 g</text>
  <text x="404" y="400" font-size="13" fill="#8A8178">42 pieces, ready to sell</text>
  <rect x="380" y="454" width="300" height="48" rx="10" fill="none" stroke="#D6D1C8" stroke-dasharray="5 4"/>
  <text x="530" y="483" font-size="13" fill="#A8A29E" text-anchor="middle" font-style="italic">value band · hidden</text>

  <!-- customer off -->
  <rect x="380" y="518" width="300" height="80" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <circle cx="416" cy="558" r="20" fill="#E2DCD2"/>
  <text x="416" y="563" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">MI</text>
  <text x="448" y="550" font-size="15" font-weight="600" fill="#1C1917">Meera Iyer</text>
  <text x="448" y="570" font-size="13" fill="#8A8178">Chennai · 6 pieces · DOB 14 Mar</text>
  <text x="448" y="588" font-size="13" fill="#A8A29E" font-style="italic">budget line · hidden</text>

  <!-- ===== RIGHT : ON (future) ===== -->
  <text x="760" y="282" font-size="12" font-weight="700" fill="#8A4208" letter-spacing="1.4">THE SAME SCREENS LATER · PRICING ON · NOTHING MOVED</text>

  <!-- stock card on -->
  <rect x="760" y="298" width="300" height="300" rx="16" fill="#FFFFFF" stroke="#C9961F" stroke-width="2" filter="url(#sh)"/>
  <rect x="776" y="314" width="268" height="150" rx="10" fill="#EFE9DF"/>
  <circle cx="910" cy="389" r="42" fill="#E2D8C6"/>
  <rect x="788" y="326" width="112" height="28" rx="14" fill="#E8F5EE"/>
  <circle cx="806" cy="340" r="4" fill="#1D7A4C"/>
  <text x="818" y="345" font-size="13" font-weight="600" fill="#15603C">In stock</text>
  <text x="776" y="492" font-size="16" font-weight="600" fill="#1C1917">Antique Kundan Choker</text>
  <text x="776" y="514" font-size="13" fill="#8A8178">TAG-8841 · 22K · Kundan</text>
  <line x1="776" y1="532" x2="1044" y2="532" stroke="#F1EFEA"/>
  <text x="776" y="558" font-size="13" fill="#8A8178">Pure gold</text>
  <text x="1044" y="560" font-size="20" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">41.590 g</text>
  <text x="776" y="582" font-size="13" fill="#8A8178">Gross · stones</text>
  <text x="1044" y="583" font-size="14" font-weight="600" fill="#1C1917" text-anchor="end">48.650 g · 7.060 g</text>

  <!-- socket filled -->
  <rect x="760" y="614" width="300" height="52" rx="10" fill="#FBF3E0"/>
  <text x="776" y="635" font-size="13" fill="#8A4208">Value at today's rate</text>
  <text x="1044" y="647" font-size="18" font-weight="700" fill="#1C1917" text-anchor="end">₹3,85,000</text>

  <!-- owner stat on -->
  <rect x="1092" y="298" width="300" height="140" rx="16" fill="#FFFFFF" stroke="#C9961F" stroke-width="2" filter="url(#sh)"/>
  <text x="1116" y="330" font-size="13" fill="#8A8178">Gold on the floor</text>
  <text x="1116" y="372" font-size="30" font-weight="700" fill="#1C1917">1,847 g</text>
  <text x="1116" y="400" font-size="13" fill="#8A8178">42 pieces, ready to sell</text>
  <rect x="1092" y="454" width="300" height="48" rx="10" fill="#FBF3E0"/>
  <text x="1108" y="483" font-size="13" fill="#8A4208">Worth at today's rate</text>
  <text x="1368" y="483" font-size="16" font-weight="700" fill="#1C1917" text-anchor="end">₹1.34 Cr</text>

  <!-- customer on -->
  <rect x="1092" y="518" width="300" height="80" rx="16" fill="#FFFFFF" stroke="#C9961F" stroke-width="2" filter="url(#sh)"/>
  <circle cx="1128" cy="558" r="20" fill="#E2DCD2"/>
  <text x="1128" y="563" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">MI</text>
  <text x="1160" y="550" font-size="15" font-weight="600" fill="#1C1917">Meera Iyer</text>
  <text x="1160" y="570" font-size="13" fill="#8A8178">Chennai · 6 pieces · DOB 14 Mar</text>
  <text x="1160" y="588" font-size="13" font-weight="600" fill="#8A4208">Budget ₹8,00,000 · spent ₹5,37,145</text>

  <!-- connective arrows -->
  <path d="M700 448 l44 0 M724 440 l10 8 l-10 8" fill="none" stroke="#C9961F" stroke-width="2" stroke-linecap="round"/>
  <text x="722" y="432" font-size="12" font-weight="600" fill="#8A4208" text-anchor="middle">flip the switch</text>

  <!-- ===== EXPLAINER ===== -->
  <text x="48" y="720" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">HOW THE FACILITY WORKS</text>
  <rect x="48" y="736" width="1344" height="236" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="80" y="776" font-size="15" font-weight="600" fill="#1C1917">1 · The field exists from day one</text>
  <text x="80" y="800" font-size="13" fill="#57534E">Every piece, customer and stock-out already carries its value,</text>
  <text x="80" y="820" font-size="13" fill="#57534E">budget and history columns — nullable, empty, costing nothing.</text>
  <text x="80" y="840" font-size="13" fill="#8A8178">Adding them now is free. Adding them later is a migration.</text>

  <text x="520" y="776" font-size="15" font-weight="600" fill="#1C1917">2 · One component hides them</text>
  <text x="520" y="800" font-size="13" fill="#57534E">Every rupee on every screen renders through one ValueSlot.</text>
  <text x="520" y="820" font-size="13" fill="#57534E">Switch off, it draws nothing and collapses its space.</text>
  <text x="520" y="840" font-size="13" fill="#8A8178">The whole system turns on with a single flag.</text>

  <text x="960" y="776" font-size="15" font-weight="600" fill="#1C1917">3 · Weight stays the spine</text>
  <text x="960" y="800" font-size="13" fill="#57534E">A card leads with pure gold today and still leads with it</text>
  <text x="960" y="820" font-size="13" fill="#57534E">after pricing is on. Value hangs off the piece as a second</text>
  <text x="960" y="840" font-size="13" fill="#8A8178">line — it never displaces the grams.</text>

  <line x1="80" y1="872" x2="1360" y2="872" stroke="#F1EFEA"/>
  <text x="80" y="906" font-size="14" font-weight="600" fill="#1C1917">Everything ties to the piece and its weight.</text>
  <text x="80" y="930" font-size="13" fill="#57534E">Customer history, budget and price all attach to the same tag and the same grams the system already tracks. When pricing is switched on, nothing</text>
  <text x="80" y="950" font-size="13" fill="#57534E">is rebuilt — the sockets simply fill. That is the facility: present in the model, reserved in the layout, dark until the owner turns it on.</text>
</svg>
