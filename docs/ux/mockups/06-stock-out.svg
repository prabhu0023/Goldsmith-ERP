<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="940" fill="#FAF9F7"/>

  <!-- rail -->
  <rect x="0" y="0" width="248" height="940" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="940" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">Main showroom</text>
  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">WORK</text>
  <circle cx="40" cy="140" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="145" font-size="14" fill="#44403C">Today</text>
  <circle cx="40" cy="186" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="191" font-size="14" fill="#44403C">Showroom stock</text>
  <rect x="12" y="208" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="230" r="7" fill="#C9961F"/>
  <text x="62" y="235" font-size="14" font-weight="600" fill="#FFFFFF">Sell</text>
  <circle cx="40" cy="274" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="279" font-size="14" fill="#44403C">Parcels in</text>
  <circle cx="40" cy="318" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="323" font-size="14" fill="#44403C">Customers</text>
  <line x1="12" y1="822" x2="236" y2="822" stroke="#E7E3DC"/>
  <circle cx="44" cy="870" r="18" fill="#E2DCD2"/>
  <text x="44" y="875" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">RV</text>
  <text x="72" y="864" font-size="14" font-weight="600" fill="#1C1917">Rajesh Verma</text>
  <text x="72" y="884" font-size="13" fill="#8A8178">Showroom staff · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">A piece is leaving · stock-out</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Record which pieces went out, who sold them, and the reference from your billing book. No prices here — that is kept elsewhere.</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <!-- ===== LEFT : the pieces going out ===== -->
  <text x="288" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">WHAT IS LEAVING THE SHOWCASE</text>
  <rect x="288" y="166" width="700" height="430" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <!-- column heads with a reserved, dark value column -->
  <text x="312" y="202" font-size="13" font-weight="600" fill="#8A8178">PIECE</text>
  <text x="724" y="202" font-size="13" font-weight="600" fill="#8A8178">PURE GOLD</text>
  <rect x="820" y="186" width="144" height="22" rx="6" fill="#F1EFEA"/>
  <text x="892" y="202" font-size="12" font-weight="600" fill="#A8A29E" text-anchor="middle">value · when on</text>
  <line x1="312" y1="214" x2="964" y2="214" stroke="#E7E3DC"/>

  <rect x="312" y="230" width="52" height="52" rx="10" fill="#EFE9DF"/>
  <circle cx="338" cy="256" r="16" fill="#E2D8C6"/>
  <text x="380" y="250" font-size="15" font-weight="600" fill="#1C1917">Antique Kundan Choker</text>
  <text x="380" y="270" font-size="13" fill="#8A8178">TAG-8841 · 22K · 9X82K1</text>
  <text x="788" y="262" font-size="18" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">41.590 g</text>
  <rect x="820" y="240" width="144" height="34" rx="8" fill="none" stroke="#D6D1C8" stroke-dasharray="4 3"/>
  <line x1="312" y1="300" x2="964" y2="300" stroke="#F1EFEA"/>

  <rect x="312" y="316" width="52" height="52" rx="10" fill="#EFE9DF"/>
  <circle cx="338" cy="342" r="14" fill="none" stroke="#D9CBB2" stroke-width="6"/>
  <text x="380" y="336" font-size="15" font-weight="600" fill="#1C1917">Jadau Emerald Ring</text>
  <text x="380" y="356" font-size="13" fill="#8A8178">TAG-9040 · 18K · 8H33Z9</text>
  <text x="788" y="348" font-size="18" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">12.600 g</text>
  <rect x="820" y="326" width="144" height="34" rx="8" fill="none" stroke="#D6D1C8" stroke-dasharray="4 3"/>
  <line x1="312" y1="386" x2="964" y2="386" stroke="#F1EFEA"/>

  <rect x="312" y="402" width="200" height="44" rx="10" fill="#FFFFFF" stroke="#D6D1C8" stroke-dasharray="4 3"/>
  <path d="M338 424 h14 M345 417 v14" stroke="#57534E" stroke-width="1.8" stroke-linecap="round"/>
  <text x="362" y="430" font-size="14" font-weight="600" fill="#1C1917">Scan another tag</text>

  <rect x="312" y="486" width="652" height="88" rx="12" fill="#FBF3E0"/>
  <text x="332" y="514" font-size="13" font-weight="700" fill="#8A4208" letter-spacing="1.2">LEAVING THE FLOOR</text>
  <text x="332" y="548" font-size="26" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">54.190 g</text>
  <text x="520" y="548" font-size="14" fill="#8A4208">pure gold · 2 pieces</text>
  <text x="944" y="540" font-size="13" fill="#A8A29E" text-anchor="end" font-style="italic">total value fills here later</text>

  <!-- ===== RIGHT : the record ===== -->
  <text x="1020" y="150" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">THE RECORD</text>
  <rect x="1020" y="166" width="372" height="430" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="1044" y="200" font-size="13" fill="#8A8178">Who sold it</text>
  <rect x="1044" y="210" width="324" height="52" rx="10" fill="#FBF3E0" stroke="#EBD9A8"/>
  <circle cx="1070" cy="236" r="14" fill="#E2DCD2"/>
  <text x="1070" y="241" font-size="11" font-weight="600" fill="#44403C" text-anchor="middle">RV</text>
  <text x="1094" y="241" font-size="15" font-weight="600" fill="#1C1917">Rajesh Verma</text>
  <text x="1044" y="282" font-size="13" fill="#8A8178">goes to their count, for later gamification</text>

  <text x="1044" y="322" font-size="13" fill="#8A8178">Reference number</text>
  <rect x="1044" y="332" width="324" height="48" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="1064" y="362" font-size="15" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">REF-2026-1182</text>

  <text x="1044" y="402" font-size="13" fill="#8A8178">Tax invoice number · from your billing book</text>
  <rect x="1044" y="412" width="324" height="52" rx="10" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
  <text x="1064" y="445" font-size="17" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">INV-2026-0855</text>
  <text x="1044" y="484" font-size="13" fill="#8A8178">a reference only — this app does not hold the amount</text>

  <rect x="1044" y="508" width="324" height="68" rx="12" fill="#FDF0E2"/>
  <text x="1060" y="534" font-size="13" font-weight="600" fill="#8A4208">This locks the pieces for good</text>
  <text x="1060" y="554" font-size="13" fill="#8A4208">Once out, their weights freeze. No edit, not even by the owner.</text>

  <!-- ===== bottom : the two kinds of leaving ===== -->
  <text x="288" y="640" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">TWO WAYS A PIECE LEAVES STOCK</text>

  <rect x="288" y="656" width="540" height="150" rx="16" fill="#FFFFFF" stroke="#1C1917" stroke-width="2" filter="url(#sh)"/>
  <rect x="312" y="680" width="150" height="30" rx="15" fill="#F1EFEA"/>
  <text x="387" y="700" font-size="13" font-weight="700" fill="#44403C" text-anchor="middle">Product out · here</text>
  <text x="312" y="740" font-size="15" font-weight="600" fill="#1C1917">The piece is sold and physically leaves.</text>
  <text x="312" y="764" font-size="13" fill="#57534E">Seller, reference and invoice number recorded. Staff do this</text>
  <text x="312" y="784" font-size="13" fill="#57534E">themselves — no owner needed.</text>

  <rect x="852" y="656" width="540" height="150" rx="16" fill="#FFFFFF" stroke="#C9961F" stroke-width="2" filter="url(#sh)"/>
  <rect x="876" y="680" width="160" height="30" rx="15" fill="#FBF3E0"/>
  <text x="956" y="700" font-size="13" font-weight="700" fill="#8A4208" text-anchor="middle">Scrap · owner only</text>
  <text x="876" y="740" font-size="15" font-weight="600" fill="#1C1917">The piece is melted, its gold back to the pool.</text>
  <text x="876" y="764" font-size="13" fill="#57534E">Staff can request it; only the owner marks it scrap. Then the</text>
  <text x="876" y="784" font-size="13" fill="#57534E">metal is free to issue to a karigar again.</text>

  <!-- sticky action -->
  <rect x="288" y="830" width="1104" height="86" rx="16" fill="#1C1917"/>
  <text x="320" y="866" font-size="15" fill="#A8A29E">2 pieces · 54.190 g pure gold · sold by Rajesh · INV-2026-0855</text>
  <text x="320" y="894" font-size="17" font-weight="600" fill="#FFFFFF">Ready to clear from the floor</text>
  <rect x="1104" y="852" width="264" height="48" rx="10" fill="#C9961F"/>
  <text x="1236" y="882" font-size="15" font-weight="700" fill="#1C1917" text-anchor="middle">Take them out of stock</text>
</svg>
