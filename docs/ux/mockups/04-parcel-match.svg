<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="1120" fill="#FAF9F7"/>

  <!-- rail -->
  <rect x="0" y="0" width="248" height="1120" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="1120" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">Main showroom</text>
  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">WORK</text>
  <circle cx="40" cy="140" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="145" font-size="14" fill="#44403C">Today</text>
  <circle cx="40" cy="186" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="191" font-size="14" fill="#44403C">Showroom stock</text>
  <circle cx="40" cy="230" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="235" font-size="14" fill="#44403C">Sell</text>
  <rect x="12" y="252" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="274" r="7" fill="#C9961F"/>
  <text x="62" y="279" font-size="14" font-weight="600" fill="#FFFFFF">Parcels in</text>
  <circle cx="40" cy="318" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="323" font-size="14" fill="#44403C">Customers</text>

  <text x="24" y="382" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">OPEN PARCELS</text>
  <rect x="12" y="396" width="224" height="58" rx="10" fill="#E8F5EE" stroke="#1D7A4C" stroke-width="2"/>
  <text x="28" y="420" font-size="14" font-weight="600" fill="#1C1917">BATCH-2026-044</text>
  <text x="28" y="440" font-size="13" fill="#15603C">Mahesh Soni · matches</text>
  <rect x="12" y="462" width="224" height="58" rx="10" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="28" y="486" font-size="14" font-weight="600" fill="#1C1917">BATCH-2026-045</text>
  <text x="28" y="506" font-size="13" fill="#8A8178">Lakshmi Devi · 9 to tag</text>

  <line x1="12" y1="1002" x2="236" y2="1002" stroke="#E7E3DC"/>
  <circle cx="44" cy="1050" r="18" fill="#E2DCD2"/>
  <text x="44" y="1055" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">RV</text>
  <text x="72" y="1044" font-size="14" font-weight="600" fill="#1C1917">Rajesh Verma</text>
  <text x="72" y="1064" font-size="13" fill="#8A8178">Showroom staff · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">BATCH-2026-044 · Mahesh Soni</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Order PO-2026-915 · arrived Friday 4:10 pm · 12 items, mixed · weighed on the counter scale</text>
  <rect x="1224" y="36" width="168" height="40" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1308" y="61" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Print parcel sheet</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <!-- steps -->
  <circle cx="300" cy="148" r="14" fill="#1D7A4C"/>
  <path d="M294 148 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="324" y="153" font-size="15" font-weight="600" fill="#15603C">1 · Weighed the parcel and listed what is in it</text>
  <line x1="700" y1="148" x2="760" y2="148" stroke="#D6D1C8" stroke-width="2"/>
  <circle cx="782" cy="148" r="14" fill="#1D7A4C"/>
  <path d="M776 148 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="806" y="153" font-size="15" font-weight="600" fill="#15603C">2 · Tagged all 12 items</text>
  <line x1="1030" y1="148" x2="1090" y2="148" stroke="#D6D1C8" stroke-width="2"/>
  <circle cx="1112" cy="148" r="14" fill="#1C1917"/>
  <text x="1112" y="153" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1136" y="153" font-size="15" font-weight="600" fill="#1C1917">Match and release</text>

  <!-- ============ LEFT : THE LIST IS A GATE ============ -->
  <text x="288" y="202" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">EVERY ITEM ON THE LIST MUST BE TAGGED</text>
  <rect x="288" y="218" width="492" height="438" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <rect x="310" y="240" width="156" height="30" rx="15" fill="#E8F5EE"/>
  <path d="M326 255 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
  <text x="348" y="260" font-size="13" font-weight="700" fill="#15603C">12 of 12 tagged</text>
  <text x="758" y="260" font-size="13" fill="#8A8178" text-anchor="end">no allowance here</text>

  <g font-size="14">
    <path d="M312 288 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="293" fill="#1C1917">Chettinad Temple Haram</text>
    <text x="758" y="293" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9101</text>

    <path d="M312 318 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="323" fill="#1C1917">Chettinad Temple Haram</text>
    <text x="758" y="323" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9102</text>

    <path d="M312 348 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="353" fill="#1C1917">Antique Kundan Choker</text>
    <text x="758" y="353" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9103</text>

    <path d="M312 378 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="383" fill="#1C1917">Polki Kada · pair</text>
    <text x="758" y="383" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9104</text>

    <path d="M312 408 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="413" fill="#1C1917">Polki Kada · pair</text>
    <text x="758" y="413" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9105</text>

    <path d="M312 438 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="443" fill="#1C1917">Floral Meenakari Bangle</text>
    <text x="758" y="443" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9106</text>

    <path d="M312 468 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="473" fill="#1C1917">Meenakari Pendant</text>
    <text x="758" y="473" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9107</text>

    <path d="M312 498 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="503" fill="#1C1917">Meenakari Pendant</text>
    <text x="758" y="503" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9108</text>

    <path d="M312 528 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="533" fill="#1C1917">Peacock Ruby Pendant</text>
    <text x="758" y="533" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9109</text>

    <path d="M312 558 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="563" fill="#1C1917">Jadau Emerald Ring</text>
    <text x="758" y="563" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9110</text>

    <path d="M312 588 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="593" fill="#1C1917">Jadau Emerald Ring</text>
    <text x="758" y="593" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9111</text>

    <path d="M312 618 l5 5 l9 -10" fill="none" stroke="#1D7A4C" stroke-width="2" stroke-linecap="round"/>
    <text x="340" y="623" fill="#1C1917">Temple Nakshi Ring</text>
    <text x="758" y="623" fill="#8A8178" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TAG-9112</text>
  </g>

  <text x="288" y="684" font-size="13" fill="#57534E">Every piece is its own weight. Nothing here is a multiple of anything else, so no</text>
  <text x="288" y="704" font-size="13" fill="#57534E">figure is ever pre-filled — each one is typed off the scale.</text>

  <!-- ============ RIGHT : THREE WEIGHTS, THREE COMPARISONS ============ -->
  <text x="812" y="202" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">AND ALL THREE WEIGHTS MUST AGREE</text>
  <rect x="812" y="218" width="580" height="438" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>

  <text x="836" y="252" font-size="13" font-weight="600" fill="#8A8178">　</text>
  <text x="1096" y="252" font-size="13" font-weight="600" fill="#8A8178" text-anchor="end">THE PARCEL SAID</text>
  <text x="1268" y="252" font-size="13" font-weight="600" fill="#8A8178" text-anchor="end">THE 12 TAGS SAY</text>
  <text x="1368" y="252" font-size="13" font-weight="600" fill="#8A8178" text-anchor="end">GAP</text>
  <line x1="836" y1="266" x2="1368" y2="266" stroke="#E7E3DC"/>

  <text x="836" y="302" font-size="15" fill="#1C1917">On the scale</text>
  <text x="836" y="322" font-size="13" fill="#8A8178">everything together</text>
  <text x="1096" y="306" font-size="19" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">485.500 g</text>
  <text x="1268" y="306" font-size="19" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">485.500 g</text>
  <text x="1368" y="306" font-size="17" font-weight="700" fill="#15603C" font-family="ui-monospace, Menlo, monospace" text-anchor="end">0</text>
  <line x1="836" y1="340" x2="1368" y2="340" stroke="#F1EFEA"/>

  <text x="836" y="376" font-size="15" fill="#1C1917">Stones, pearls, lac</text>
  <text x="836" y="396" font-size="13" fill="#8A8178">and anything else not gold</text>
  <text x="1096" y="380" font-size="19" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">38.200 g</text>
  <text x="1268" y="380" font-size="19" font-weight="600" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">38.200 g</text>
  <text x="1368" y="380" font-size="17" font-weight="700" fill="#15603C" font-family="ui-monospace, Menlo, monospace" text-anchor="end">0</text>
  <line x1="836" y1="414" x2="1368" y2="414" stroke="#F1EFEA"/>

  <rect x="820" y="428" width="564" height="72" rx="12" fill="#FBF3E0"/>
  <text x="836" y="458" font-size="15" font-weight="600" fill="#1C1917">Pure gold</text>
  <text x="836" y="478" font-size="13" fill="#8A4208">what we are really counting</text>
  <text x="1096" y="462" font-size="19" font-weight="700" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">447.300 g</text>
  <text x="1268" y="462" font-size="19" font-weight="700" fill="#1C1917" font-family="ui-monospace, Menlo, monospace" text-anchor="end">447.300 g</text>
  <text x="1368" y="462" font-size="17" font-weight="700" fill="#15603C" font-family="ui-monospace, Menlo, monospace" text-anchor="end">0</text>

  <!-- symmetric gauge, zero in the middle -->
  <text x="836" y="540" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.2">THE GAP ON PURE GOLD, EITHER WAY</text>
  <text x="846" y="568" font-size="13" fill="#8A8178">short</text>
  <text x="1368" y="568" font-size="13" fill="#8A8178" text-anchor="end">over</text>
  <rect x="836" y="578" width="532" height="18" rx="9" fill="#F1EFEA"/>
  <rect x="1060" y="578" width="84" height="18" fill="#E8F5EE"/>
  <line x1="1102" y1="570" x2="1102" y2="604" stroke="#1D7A4C" stroke-width="3"/>
  <text x="1102" y="624" font-size="14" font-weight="700" fill="#15603C" text-anchor="middle">exactly 0 mg</text>
  <text x="836" y="648" font-size="13" fill="#57534E">The faint band is ±6.5 mg — all that 13 weighings of rounding could ever explain.</text>

  <!-- ============ VERDICT ============ -->
  <rect x="288" y="732" width="1104" height="108" rx="16" fill="#E8F5EE" stroke="#1D7A4C" stroke-width="2"/>
  <circle cx="336" cy="786" r="22" fill="#FFFFFF"/>
  <path d="M326 786 l7 7 l15 -16" fill="none" stroke="#1D7A4C" stroke-width="3" stroke-linecap="round"/>
  <text x="378" y="776" font-size="20" font-weight="600" fill="#15603C">Everything matches. Nothing needs the owner.</text>
  <text x="378" y="802" font-size="14" fill="#15603C">12 of 12 items tagged · gross, stones and pure gold all agree to the milligram</text>
  <text x="378" y="824" font-size="13" fill="#15603C">Releasing also closes Mahesh Soni's job and settles the gold issued against it.</text>
  <rect x="1116" y="762" width="252" height="48" rx="10" fill="#1C1917"/>
  <text x="1242" y="792" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Release 12 pieces into stock</text>

  <!-- ============ THE THREE ANSWERS ============ -->
  <text x="288" y="892" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">THE ONLY THREE ANSWERS THIS SCREEN CAN GIVE</text>

  <rect x="288" y="908" width="356" height="164" rx="16" fill="#FFFFFF" stroke="#1D7A4C" stroke-width="2" filter="url(#sh)"/>
  <rect x="312" y="930" width="130" height="30" rx="15" fill="#E8F5EE"/>
  <text x="377" y="950" font-size="13" font-weight="700" fill="#15603C" text-anchor="middle">Matches exactly</text>
  <text x="312" y="986" font-size="22" font-weight="700" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">0 mg</text>
  <text x="312" y="1014" font-size="14" fill="#44403C">Staff release it. The owner</text>
  <text x="312" y="1034" font-size="14" fill="#44403C">never sees the parcel at all.</text>
  <text x="312" y="1058" font-size="13" fill="#8A8178">The normal day.</text>

  <rect x="662" y="908" width="356" height="164" rx="16" fill="#FFFFFF" stroke="#B35309" stroke-width="2" stroke-dasharray="6 4" filter="url(#sh)"/>
  <rect x="686" y="930" width="186" height="30" rx="15" fill="#FDF0E2"/>
  <text x="779" y="950" font-size="13" font-weight="700" fill="#8A4208" text-anchor="middle">Off by the last digit only</text>
  <text x="686" y="986" font-size="22" font-weight="700" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">1 – 6 mg</text>
  <text x="686" y="1014" font-size="14" fill="#44403C">Rounding across 13 weighings</text>
  <text x="686" y="1034" font-size="14" fill="#44403C">can produce this with no gold lost.</text>
  <text x="686" y="1058" font-size="13" font-weight="700" fill="#B3261E">Your call — see the question below.</text>

  <rect x="1036" y="908" width="356" height="164" rx="16" fill="#FFFFFF" stroke="#B3261E" stroke-width="2" filter="url(#sh)"/>
  <rect x="1060" y="930" width="168" height="30" rx="15" fill="#FBE9E7"/>
  <text x="1144" y="950" font-size="13" font-weight="700" fill="#8F1D17" text-anchor="middle">Gold unaccounted for</text>
  <text x="1060" y="986" font-size="22" font-weight="700" fill="#1C1917" font-family="ui-monospace, Menlo, monospace">138 mg</text>
  <text x="1060" y="1014" font-size="14" fill="#44403C">Twenty-one times what rounding</text>
  <text x="1060" y="1034" font-size="14" fill="#44403C">could explain. Parcel stops dead.</text>
  <text x="1060" y="1058" font-size="13" fill="#8F1D17">Only the owner can clear it.</text>

  <text x="288" y="1100" font-size="13" fill="#57534E">Same scale for the parcel and for every piece, reading to 1 mg. Twelve pieces plus the parcel is thirteen weighings, each rounding by up to half a milligram.</text>
</svg>
