<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#FAF9F7"/>

  <!-- rail -->
  <rect x="0" y="0" width="248" height="900" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="900" stroke="#E7E3DC"/>
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C9961F"/>
  <text x="44" y="51" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle" font-family="Georgia, serif">JGD</text>
  <text x="76" y="42" font-size="15" font-weight="600" fill="#1C1917">Jai Gulab Dev</text>
  <text x="76" y="60" font-size="13" fill="#8A8178">Main showroom</text>
  <text x="24" y="104" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.2">OUTREACH</text>
  <rect x="12" y="118" width="224" height="44" rx="10" fill="#1C1917"/>
  <circle cx="40" cy="140" r="7" fill="#C9961F"/>
  <text x="62" y="145" font-size="14" font-weight="600" fill="#FFFFFF">Wishes</text>
  <rect x="196" y="131" width="28" height="20" rx="10" fill="#FBF3E0"/>
  <text x="210" y="145" font-size="12" font-weight="700" fill="#8A4208" text-anchor="middle">3</text>
  <circle cx="40" cy="186" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="191" font-size="14" fill="#44403C">Broadcast</text>
  <circle cx="40" cy="230" r="7" fill="none" stroke="#8A8178" stroke-width="1.6"/>
  <text x="62" y="235" font-size="14" fill="#44403C">Catalogue share</text>
  <line x1="12" y1="822" x2="236" y2="822" stroke="#E7E3DC"/>
  <circle cx="44" cy="870" r="18" fill="#E2DCD2"/>
  <text x="44" y="875" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">RV</text>
  <text x="72" y="864" font-size="14" font-weight="600" fill="#1C1917">Rajesh Verma</text>
  <text x="72" y="884" font-size="13" fill="#8A8178">Showroom staff · switch</text>

  <!-- header -->
  <text x="288" y="52" font-size="24" font-weight="600" fill="#1C1917">Wishes</text>
  <text x="288" y="76" font-size="14" fill="#8A8178">Birthdays and anniversaries come up on their own. Send with a tap, or let it send itself.</text>
  <line x1="248" y1="104" x2="1440" y2="104" stroke="#E7E3DC"/>

  <!-- ===== automation toggle ===== -->
  <rect x="288" y="136" width="1104" height="92" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="312" y="160" width="52" height="44" rx="22" fill="#1D7A4C"/>
  <circle cx="346" cy="182" r="17" fill="#FFFFFF"/>
  <text x="388" y="176" font-size="16" font-weight="600" fill="#1C1917">Send wishes automatically at 9 am</text>
  <text x="388" y="200" font-size="13" fill="#8A8178">On, each morning's birthdays and anniversaries go out on WhatsApp without you lifting a finger.</text>
  <rect x="1180" y="156" width="188" height="52" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="1274" y="188" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Edit the message</text>

  <!-- ===== today's wishes ===== -->
  <text x="288" y="272" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">COMING UP · 3</text>

  <rect x="288" y="288" width="700" height="92" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="288" width="4" height="92" rx="2" fill="#C9961F"/>
  <circle cx="330" cy="334" r="18" fill="#E2DCD2"/>
  <text x="330" y="339" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">PM</text>
  <text x="362" y="322" font-size="15" font-weight="600" fill="#1C1917">Priya Malhotra · birthday today</text>
  <text x="362" y="344" font-size="13" fill="#8A8178">VIP Bridal · last took home a Polki kada</text>
  <text x="362" y="364" font-size="13" fill="#8A8178">opted in · will auto-send at 9 am unless you send now</text>
  <rect x="848" y="312" width="116" height="44" rx="10" fill="#C9961F"/>
  <text x="906" y="340" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Send now</text>

  <rect x="288" y="392" width="700" height="92" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="392" width="4" height="92" rx="2" fill="#C9961F"/>
  <circle cx="330" cy="438" r="18" fill="#E2DCD2"/>
  <text x="330" y="443" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">AK</text>
  <text x="362" y="426" font-size="15" font-weight="600" fill="#1C1917">Arjun &amp; Kavya · anniversary tomorrow</text>
  <text x="362" y="448" font-size="13" fill="#8A8178">High net worth · 4 pieces with us</text>
  <text x="362" y="468" font-size="13" fill="#8A8178">opted in · scheduled for 9 am tomorrow</text>
  <rect x="848" y="416" width="116" height="44" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="906" y="444" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Preview</text>

  <rect x="288" y="496" width="700" height="92" rx="14" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <rect x="288" y="496" width="4" height="92" rx="2" fill="#B35309"/>
  <circle cx="330" cy="542" r="18" fill="#E2DCD2"/>
  <text x="330" y="547" font-size="13" font-weight="600" fill="#44403C" text-anchor="middle">RS</text>
  <text x="362" y="530" font-size="15" font-weight="600" fill="#1C1917">Ravi Shankar · birthday today</text>
  <text x="362" y="552" font-size="13" fill="#8A8178">Festive collector</text>
  <text x="362" y="572" font-size="13" font-weight="600" fill="#8A4208">not opted in to WhatsApp · will not auto-send</text>
  <rect x="848" y="520" width="116" height="44" rx="10" fill="#FFFFFF" stroke="#D6D1C8"/>
  <text x="906" y="548" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Call instead</text>

  <!-- ===== right : the two senders, and the message ===== -->
  <text x="1032" y="272" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">SENT FROM</text>
  <rect x="1032" y="288" width="360" height="130" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <text x="1056" y="320" font-size="14" fill="#57534E">Two names under the owner can be the sender.</text>
  <rect x="1056" y="334" width="150" height="40" rx="20" fill="#1C1917"/>
  <text x="1131" y="359" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sanjay (Owner)</text>
  <rect x="1218" y="334" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E7E3DC"/>
  <text x="1293" y="359" font-size="13" fill="#44403C" text-anchor="middle">Priya (Manager)</text>
  <text x="1056" y="402" font-size="13" fill="#8A8178">Wishes feel personal when they come from a known name.</text>

  <text x="1032" y="454" font-size="12" font-weight="700" fill="#8A8178" letter-spacing="1.4">THE BIRTHDAY MESSAGE</text>
  <rect x="1032" y="470" width="360" height="118" rx="16" fill="#FFFFFF" stroke="#E7E3DC" filter="url(#sh)"/>
  <text x="1056" y="502" font-size="13" fill="#1C1917">Happy birthday {name}! Warm wishes from</text>
  <text x="1056" y="522" font-size="13" fill="#1C1917">all of us at Jai Gulab Dev. Do visit — we would</text>
  <text x="1056" y="542" font-size="13" fill="#1C1917">love to show you something special.</text>
  <text x="1056" y="572" font-size="12" fill="#8A8178">{name} fills in per person · edit once, applies to all</text>

  <!-- footer -->
  <text x="288" y="632" font-size="13" fill="#8A8178">The dates come straight off each customer's profile (mockup 23). No pricing involved — this is contact and goodwill only.</text>
  <text x="288" y="656" font-size="13" fill="#8A8178">A customer who is not opted in is still shown, so you can reach them another way, but they are never auto-messaged.</text>
</svg>
