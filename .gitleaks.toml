# Secret scan configuration (EP-01-S10). gitleaks' default rules, plus one rule for database
# connection strings that carry a password, which the defaults do not cover.
# Add an allow-list entry only for a confirmed false positive, with a comment saying why.
title = "Goldsmith ERP secret scan"

[extend]
useDefault = true

[[rules]]
id = "connection-string-with-password"
description = "Database or broker connection string with an embedded password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|mssql|sqlserver)://[^:@/\s'"]+:([^@/\s'"]{6,})@[^\s'"]+'''
secretGroup = 1
entropy = 3.0
keywords = ["postgres", "mysql", "mariadb", "mongodb", "redis", "amqp", "mssql", "sqlserver"]
